name: Discord Auth Diagnostic (manual only)
run-name: Manual Discord auth and permission test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test Discord bot identity, channel, and message access
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node --input-type=module <<'NODE'
          const token = process.env.DISCORD_BOT_TOKEN;
          const channelId = "1476540488147533895";
          const messageId = "1563458971489271818";
          if (!token) throw new Error("DISCORD_BOT_TOKEN is missing from this workflow environment.");
          const auth = { authorization: `Bot ${token}` };
          async function check(label, url) {
            const response = await fetch(url, { headers: auth, signal: AbortSignal.timeout(15000) });
            const body = await response.json().catch(() => ({}));
            console.log(`${label}: HTTP ${response.status}`);
            if (!response.ok) {
              const known = {
                401: "Discord did not accept the token/authorization format for this request.",
                403: "Discord accepted authentication but denied access (permission/access issue).",
                404: "Resource not found or not visible to this bot.",
                429: "Discord rate limited the test; retry later."
              };
              console.log(`Result: ${known[response.status] ?? "Request failed."}`);
              if (body.code) console.log(`Discord error code: ${body.code}`);
              return { ok: false, status: response.status };
            }
            return { ok: true, body };
          }
          const who = await check("Bot identity", "https://discord.com/api/v10/users/@me");
          if (!who.ok) process.exit(1);
          console.log(`Authenticated bot: ${who.body.username ?? "(name unavailable)"}; bot account: ${Boolean(who.body.bot)}`);
          if (who.body.bot !== true) {
            console.log("Result: the token authenticated as a non-bot user; stopping.");
            process.exit(1);
          }
          const channel = await check("Approved channel access", `https://discord.com/api/v10/channels/${channelId}`);
          if (!channel.ok) process.exit(1);
          console.log(`Channel returned: ${channel.body.name ?? "(name unavailable)"}; type: ${channel.body.type}`);
          const message = await check("Approved message read", `https://discord.com/api/v10/channels/${channelId}/messages/${messageId}`);
          if (!message.ok) process.exit(1);
          if (message.body.id !== messageId || message.body.channel_id !== channelId) {
            console.log("Result: response did not match the approved message; stopping.");
            process.exit(1);
          }
          const attachments = Array.isArray(message.body.attachments) ? message.body.attachments : [];
          console.log(`Approved message read successfully. ZIP attachments: ${attachments.filter(a => String(a.filename ?? "").toLowerCase().endsWith(".zip")).length}`);
          NODE
