name: Hosted execution target validation

on:
  pull_request:
    paths:
      - packages/contracts/src/index.ts
      - packages/execution-core/src/index.ts
      - packages/platform-ops/src/index.ts
      - packages/mcp/src/index.ts
      - tests/functional-foundation.test.mjs
      - tests/functional-foundation-api.test.mjs
      - .github/workflows/hosted-execution-target-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-execution-target-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  execution-target:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile all apps and packages
        run: npm run build
      - name: Run execution-job and API/MCP regressions
        run: node --import ./scripts/offline-network-guard.mjs --test tests/functional-foundation.test.mjs tests/functional-foundation-api.test.mjs
