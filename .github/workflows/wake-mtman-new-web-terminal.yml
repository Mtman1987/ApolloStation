name: Wake and verify mtman-new web-terminal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mtman-new-web-terminal-wake
  cancel-in-progress: false

jobs:
  wake-and-verify:
    name: Wake and verify authenticated terminal
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: sprite-release
    env:
      SPRITE_ORG: mtman-new
      SPRITE_NAME: web-terminal
      EXPECTED_SPRITE_ID: sprite-2249fee2-ecf3-4b10-8bc1-314f4b9e5bcc
      SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
    steps:
      - name: Validate credentials and target identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SPRITES_TOKEN:-}" || { echo "::error::Missing SPRITES_TOKEN in sprite-release environment."; exit 1; }
          sprite_json="$(curl -fsS --retry 2 --retry-all-errors -H "Authorization: Bearer $SPRITES_TOKEN" "https://api.sprites.dev/v1/sprites/$SPRITE_NAME")"
          actual_id="$(jq -r '.id // empty' <<<"$sprite_json")"
          [[ "$actual_id" == "$EXPECTED_SPRITE_ID" ]] || { echo "::error::Refusing unexpected Sprite ID: $actual_id"; exit 1; }
          auth="$(jq -r '.url_settings.auth // "unknown"' <<<"$sprite_json")"
          [[ "$auth" == "sprite" ]] || { echo "::error::Sprite URL auth is '$auth'; expected private sprite auth."; exit 1; }
          echo "Target identity verified; private URL authentication preserved."

      - name: Install Sprites CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://sprites.dev/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/sprite" --version

      - name: Wake Sprite and verify terminal, Fly CLI, and Fly authentication
        shell: bash
        run: |
          set -uo pipefail
          sprite auth setup --token "$SPRITES_TOKEN"
          last_status=1
          for attempt in 1 2 3; do
            echo "Wake/readiness attempt $attempt of 3"
            set +e
            output="$(timeout 45s sprite exec --no-port-forward -o "$SPRITE_ORG" -s "$SPRITE_NAME" -- /bin/bash -lc '
              set -euo pipefail
              printf "SPMT_TERMINAL_READY\n"
              printf "user=%s\n" "$(id -un)"
              printf "cwd=%s\n" "$PWD"
              if command -v flyctl >/dev/null 2>&1; then
                flyctl auth whoami >/dev/null
                echo "fly_cli=flyctl"
              elif command -v fly >/dev/null 2>&1; then
                fly auth whoami >/dev/null
                echo "fly_cli=fly"
              else
                echo "Fly CLI is not installed." >&2
                exit 41
              fi
              echo "fly_auth=verified"
            ' 2>&1)"
            last_status=$?
            set -e
            printf '%s\n' "$output" | sed -E 's/(Bearer|token|secret|password)[=: ]+[^ ]+/\1=[REDACTED]/Ig'
            if (( last_status == 0 )) && grep -q '^SPMT_TERMINAL_READY$' <<<"$output" && grep -q '^fly_auth=verified$' <<<"$output"; then
              echo "startup_result=ready"
              exit 0
            fi
            echo "attempt_result=failed exit=$last_status"
            if (( attempt < 3 )); then sleep 10; fi
          done
          echo "::error::Sprite failed bounded terminal/Fly-auth readiness checks."
          exit "$last_status"
