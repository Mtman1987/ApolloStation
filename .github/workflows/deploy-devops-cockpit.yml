name: Deploy standalone Apollo DevOps Cockpit

on:
  push:
    branches:
      - feat/standalone-devops-cockpit
    paths:
      - "hostless.yaml"
      - "tools/devops-cockpit/**"
      - "scripts/hostless/deploy-devops-cockpit.mjs"
      - ".github/workflows/deploy-devops-cockpit.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: apollo-devops-cockpit-hostless
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy cockpit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check tools/devops-cockpit/server.mjs
          node --check tools/devops-cockpit/worker.mjs
          node --check tools/devops-cockpit/cron.mjs
          node --check scripts/hostless/deploy-devops-cockpit.mjs
      - name: Install Hostless CLI
        run: |
          curl -fsSL https://hostless.cloud/install.sh | bash
          hostless --version
      - name: Provision the separate Hostless cockpit app
        env:
          HOSTLESS_TOKEN: ${{ secrets.HOSTLESS_NODE1_TOKEN }}
          HOSTLESS_NODE2_TOKEN: ${{ secrets.HOSTLESS_NODE2_TOKEN }}
          NODE1_TURSO_AUTH_TOKEN: ${{ secrets.NODE1_TURSO_AUTH_TOKEN }}
          NODE2_TURSO_AUTH_TOKEN: ${{ secrets.NODE2_TURSO_AUTH_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL || vars.TURSO_DATABASE_URL || 'libsql://apollo-persistence-spike-mtman1987.aws-us-east-1.turso.io' }}
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/hostless/deploy-devops-cockpit.mjs
