name: Inspect Hostless standalone worker capacity

on:
  push:
    branches:
      - feat/standalone-devops-cockpit
    paths:
      - ".github/workflows/deploy-devops-cockpit.yml"
      - "tools/devops-cockpit/**"
      - "scripts/hostless/deploy-devops-cockpit.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostless-cockpit-discovery
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate browser worker source
        run: |
          node --check tools/devops-cockpit/server.mjs
          node --check tools/devops-cockpit/worker.mjs
          node --check tools/devops-cockpit/cron.mjs
          node --check scripts/hostless/deploy-devops-cockpit.mjs
      - name: Install Hostless CLI
        run: |
          curl -fsSL https://hostless.cloud/install.sh | bash
          hostless --version
      - name: Read Node 1 project ID and Hostless worker/cron create schemas
        env:
          NODE1_TOKEN: ${{ secrets.HOSTLESS_NODE1_TOKEN }}
        run: |
          set -euo pipefail
          PROJECTS="$(curl -fsS --max-time 15 -H "Authorization: $NODE1_TOKEN" https://api.hostless.cloud/v1/projects)"
          echo "=== Node 1 accessible Hostless projects ==="
          echo "$PROJECTS" | jq -r 'if type == "array" then .[] | {id,name} else (.projects // [])[] | {id,name} end'
          echo "=== Hostless MCP create-tool schemas ==="
          curl -fsS --max-time 20 https://mcp.hostless.app/mcp \
            -H "Authorization: $NODE1_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            | jq '.result.tools[] | select(.name == "workers_create" or .name == "cron_jobs_create" or .name == "projects_list" or .name == "workers_list" or .name == "cron_jobs_list") | {name,inputSchema}'
      - name: Inspect account scopes, current resources and CLI worker commands
        env:
          NODE1_TOKEN: ${{ secrets.HOSTLESS_NODE1_TOKEN }}
          NODE2_TOKEN: ${{ secrets.HOSTLESS_NODE2_TOKEN }}
          NODE3_TOKEN: ${{ secrets.HOSTLESS_NODE3_TOKEN }}
        run: |
          set +e
          inspect_account() {
            label="$1"
            token="$2"
            [ -n "$token" ] || { echo "=== $label: no token configured ==="; return; }
            echo "=== $label credential scopes ==="
            curl --max-time 8 -sS -H "Authorization: $token" https://api.hostless.cloud/v1/api-keys/current | jq '{name,prefix,scopes,projects}'
            echo "=== $label projects ==="
            curl --max-time 8 -sS -H "Authorization: $token" https://api.hostless.cloud/v1/projects | jq '[.projects[]? | {id,name}]'
            echo "=== $label workers ==="
            curl --max-time 8 -sS -H "Authorization: $token" 'https://api.hostless.cloud/v1/workers' | jq '[.workers[]? | {name,projectId,status,resources}]'
            echo "=== $label cron jobs ==="
            curl --max-time 8 -sS -H "Authorization: $token" 'https://api.hostless.cloud/v1/cron-jobs' | jq '[.cronJobs[]? | {name,projectId,status,schedule}]'
            echo "=== $label billing breakdown (if permitted) ==="
            curl --max-time 8 -sS -H "Authorization: $token" 'https://api.hostless.cloud/v1/billing/breakdown' | jq '{usage,allowance,resources,totals}'
          }
          inspect_account "Hostless Node 1" "$NODE1_TOKEN"
          inspect_account "Hostless Node 2" "$NODE2_TOKEN"
          inspect_account "Hostless Node 3" "$NODE3_TOKEN"
          echo "=== Hostless CLI top-level commands ==="
          timeout 8s hostless --help
          echo "=== Hostless CLI create commands ==="
          timeout 8s hostless create --help
          echo "=== Hostless CLI worker commands ==="
          timeout 8s hostless worker --help
          timeout 8s hostless workers --help
          echo "=== Hostless CLI cron commands ==="
          timeout 8s hostless cron --help
          timeout 8s hostless cron-job --help
          timeout 8s hostless cron-jobs --help
