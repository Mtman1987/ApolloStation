name: Manual Sprite Diagnostics

on:
  push:
    branches: [main]
    paths: [".github/workflows/manual-sprite-diagnostics.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Capture Apollo Sprite service failure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sprite-release
    env:
      SPRITE_ORG: testing-968
      SPRITE_NAME: web-terminal
      SPRITE_PUBLIC_URL: https://web-terminal-bvesa.sprites.app
      SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Sprites CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://sprites.dev/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Capture bounded read-only diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          sprite auth setup --token "$SPRITES_TOKEN"
          set +e
          sprite exec --no-port-forward -o "$SPRITE_ORG" -s "$SPRITE_NAME" -- /bin/bash -lc '
            set +e
            echo "=== time ==="
            date -u
            echo "=== active release ==="
            readlink -f /home/sprite/apollo-release/current
            echo "=== services ==="
            sprite-env services list
            echo "=== apollo-sandbox ==="
            sprite-env services get apollo-sandbox
            echo "=== service help ==="
            sprite-env services --help
            echo "=== listeners ==="
            ss -ltnp
            echo "=== supervised processes ==="
            ps -eo pid,ppid,stat,etime,cmd | grep -E "run-supervised-sandbox|dist/web-server|apollo-sandbox" | grep -v grep
            echo "=== local sandbox health ==="
            curl -sS --max-time 10 -D - http://127.0.0.1:8080/sandbox/health
            echo
            echo "=== local HearMeOut health ==="
            curl -sS --max-time 10 -D - http://127.0.0.1:8080/health/hearmeout
            echo
            echo "=== recent release deploy log ==="
            latest="$(find /home/sprite/data/release/deploy-runs -mindepth 1 -maxdepth 1 -type d -printf "%T@ %p\n" 2>/dev/null | sort -nr | head -1 | cut -d" " -f2-)"
            test -n "$latest" && tail -n 240 "$latest/deploy.log"
          ' > diagnostics/sprite-service.txt 2>&1
          remote_status=$?
          curl --silent --show-error --max-time 30 --dump-header - --output - --write-out '\nHTTP_STATUS=%{http_code}\n' "$SPRITE_PUBLIC_URL/health/hearmeout" > diagnostics/public-health.txt 2>&1
          health_status=$?
          curl --silent --show-error --max-time 30 --dump-header - --output - --write-out '\nHTTP_STATUS=%{http_code}\n' "$SPRITE_PUBLIC_URL/api/watch/broadcast/state?roomId=system-spacemountainlive-lounge" > diagnostics/public-lounge-state.txt 2>&1
          state_status=$?
          set -e
          printf 'remote=%s public_health=%s public_state=%s\n' "$remote_status" "$health_status" "$state_status" > diagnostics/status.txt
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apollo-sprite-diagnostics
          path: diagnostics/
          retention-days: 1
          if-no-files-found: error
