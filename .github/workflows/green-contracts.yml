name: Green shared contracts

concurrency:
  group: green-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - "packages/**"
      - "apps/**"
      - "tests/**"
      - "scripts/**"
      - "sandbox/**"
      - "config/**"
      - "deploy/**"
      - "docs/**"
      - "*.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/green-contracts.yml"

jobs:
  green:
    name: Validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Install browser and media dependencies
        run: |
          npx playwright install --with-deps chromium
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Run deterministic shared contracts
        run: npm run test:sprite
      - name: Verify real audio and fallback recovery
        run: npm run test:rtc-browser
      - name: Verify HLS and audio languages
        run: node scripts/test-hmo-hls-browser.mjs
      - name: Verify shared room media playback
        run: node scripts/test-hmo-media-browser.mjs
      - name: Verify room-first player and sustained presence
        run: node scripts/test-hmo-room-window-browser.mjs
      - name: Verify cached audio recovery
        run: node scripts/test-hmo-cached-audio-browser.mjs
      - name: Verify screen sharing
        run: node scripts/test-hmo-screen-browser.mjs
