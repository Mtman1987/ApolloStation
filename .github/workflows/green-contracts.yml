name: Green shared contracts

on:
  pull_request:
    paths:
      - "packages/**"
      - "apps/**"
      - "tests/**"
      - "scripts/**"
      - "sandbox/**"
      - "config/**"
      - "deploy/**"
      - "docs/**"
      - "*.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/green-contracts.yml"
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "apps/**"
      - "tests/**"
      - "scripts/**"
      - "sandbox/**"
      - "config/**"
      - "deploy/**"
      - "docs/**"
      - "*.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/green-contracts.yml"

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Install media test dependency
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: npm test
  rtc-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Verify real audio and fallback recovery
        run: npm run test:rtc-browser
      - name: Verify shared room media playback
        run: node scripts/test-hmo-media-browser.mjs
