name: Install approved persistent HearMeOut migration
on:
  push:
    branches: [diagnostics/hmo-cutover-install-20260912]
    paths: [.github/workflows/apply-approved-hmo-cutover.yml, scripts/sprites/apply-approved-hmo-cutover.mjs]
permissions:
  contents: read
  actions: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: apollo-release-sprite
      cancel-in-progress: false
    environment: sprite-release
    env:
      SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Retrieve the approved encrypted capsule
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          const response=await fetch('https://api.github.com/repos/Mtman1987/hearmeout-main/actions/jobs/103624112214/logs',{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});
          if(!response.ok)throw Error('Approved export log could not be retrieved');
          const match=(await response.text()).match(/HMO_ENCRYPTED_TRANSFER=([A-Za-z0-9+/=]+)/);
          if(!match)throw Error('The approved export did not complete');
          const capsule=Buffer.from(match[1],'base64').toString('utf8');
          const value=JSON.parse(capsule);if(value.schemaVersion!==1||!value.wrappedKey||!value.ciphertext)throw Error('Invalid encrypted capsule');
          writeFileSync('/tmp/hmo-approved-capsule.json',capsule,{mode:0o600,flag:'wx'});
          console.log('Encrypted capsule retrieved; no plaintext configuration is exposed');
          JS
      - name: Verify destination and install with recovery
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://sprites.dev/install.sh | bash
          export PATH="$HOME/.local/bin:$PATH"
          sprite auth setup --token "$SPRITES_TOKEN"
          actual="$(sprite api /v1/sprites/web-terminal -- --silent | jq -r '.id')"
          test "$actual" = sprite-fec8d6f2-49f0-4e28-bc6d-e8a7ae364280
          sprite checkpoint create -o testing-968 -s web-terminal --comment 'Before owner-approved persistent HearMeOut import'
          sprite exec --no-port-forward -o testing-968 -s web-terminal --file scripts/sprites/apply-approved-hmo-cutover.mjs:/tmp/apply-approved-hmo-cutover.mjs --file /tmp/hmo-approved-capsule.json:/tmp/hmo-approved-capsule.json -- node /tmp/apply-approved-hmo-cutover.mjs
      - name: Remove runner transit capsule
        if: always()
        run: rm -f /tmp/hmo-approved-capsule.json
