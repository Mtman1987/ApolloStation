name: ApolloStation Hostless private owner preview

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Build, configure, and deploy the private empty-data owner preview"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# v2 lets the repaired run proceed even if an older run is stuck in apt.
concurrency:
  group: apollo-hostless-private-preview-v2
  cancel-in-progress: false

jobs:
  test:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install verified static media test binaries
        timeout-minutes: 8
        run: |
          package="ffmpeg-n8.1.2-50-g1a748fe2cd-linux64-gpl-8.1"
          archive="$RUNNER_TEMP/ffmpeg.tar.xz"
          media_dir="$RUNNER_TEMP/ffmpeg/bin"
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 300 "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-31-13-27/$package.tar.xz" -o "$archive"
          echo "c733b4b2951e5957e15505f788b2c65a7a41b6da4b289e295852cc38079b4d2b  $archive" | sha256sum --check --strict
          mkdir -p "$media_dir"
          tar -xJf "$archive" -C "$media_dir" --strip-components=2 "$package/bin/ffmpeg" "$package/bin/ffprobe"
          chmod +x "$media_dir/ffmpeg" "$media_dir/ffprobe"
          echo "$media_dir" >> "$GITHUB_PATH"
          "$media_dir/ffmpeg" -version
          "$media_dir/ffprobe" -version
      - run: npm ci
      - name: Verify preview launcher syntax
        run: node --check scripts/hostless/run-private-preview.mjs && node --check scripts/hostless/deploy-private-preview.mjs
      - name: Build and run regression suite
        run: npm test

  deploy:
    needs: test
    if: ${{ needs.test.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Hostless CLI
        run: |
          curl -fsSL https://hostless.cloud/install.sh | bash
          hostless --version
      - name: Deploy Node 1 private preview only
        env:
          HOSTLESS_TOKEN: ${{ secrets.HOSTLESS_NODE1_TOKEN }}
          APOLLO_PREVIEW_PASSWORD: ${{ secrets.APOLLO_PREVIEW_PASSWORD }}
        run: node scripts/hostless/deploy-private-preview.mjs
