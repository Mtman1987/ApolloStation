name: Hostless static-site account discovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hostless-static-site-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect ${{ matrix.label }} Hostless Sites access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Node 1 account
            secret: HOSTLESS_NODE1_TOKEN
          - label: Node 2 account
            secret: HOSTLESS_NODE2_TOKEN
    steps:
      - name: Read static-site inventory and scope access
        env:
          HOSTLESS_TOKEN: ${{ secrets[matrix.secret] }}
          LABEL: ${{ matrix.label }}
        run: |
          node --input-type=module <<'NODE'
          const base = "https://api.hostless.cloud/v1";
          const token = process.env.HOSTLESS_TOKEN;
          if (!token) {
            console.log(JSON.stringify({account:process.env.LABEL,tokenConfigured:false}));
            process.exit(0);
          }
          async function get(path) {
            const response = await fetch(base + path, {
              headers: {Authorization: token, Accept: "application/json"},
              signal: AbortSignal.timeout(60000)
            });
            const body = await response.text();
            let parsed = {};
            try { parsed = body ? JSON.parse(body) : {}; } catch {}
            return {status:response.status,body:parsed};
          }
          const rows = (value, keys) => {
            if (Array.isArray(value)) return value;
            for (const key of keys) {
              if (Array.isArray(value?.[key])) return value[key];
              if (Array.isArray(value?.data?.[key])) return value.data[key];
            }
            if (Array.isArray(value?.data)) return value.data;
            return [];
          };
          async function mcp(method, params, id) {
            const response = await fetch("https://mcp.hostless.app/mcp", {
              method: "POST",
              headers: {Authorization:token,"Content-Type":"application/json",Accept:"application/json, text/event-stream"},
              body: JSON.stringify({jsonrpc:"2.0",id,method,params}),
              signal: AbortSignal.timeout(15000)
            });
            const raw = await response.text();
            let payload = null;
            try { payload = JSON.parse(raw); } catch {
              const data = raw.split(/\r?\n/).filter(line=>line.startsWith("data:")).map(line=>line.slice(5).trim()).filter(Boolean);
              if(data.length){try{payload=JSON.parse(data[data.length-1]);}catch{}}
            }
            return {status:response.status,sessionId:response.headers.get("mcp-session-id"),payload};
          }
          const mcpInit = await mcp("initialize",{protocolVersion:"2025-03-26",capabilities:{},clientInfo:{name:"apollo-hostless-static-discovery",version:"1.0.0"}},1);
          let mcpTools = {status:mcpInit.status,tools:[],error:mcpInit.payload?.error?.message??null};
          if(mcpInit.status>=200 && mcpInit.status<300 && mcpInit.payload?.result){
            const headers={Authorization:token,"Content-Type":"application/json",Accept:"application/json, text/event-stream"};
            if(mcpInit.sessionId) headers["MCP-Session-Id"]=mcpInit.sessionId;
            const listed=await fetch("https://mcp.hostless.app/mcp",{method:"POST",headers,body:JSON.stringify({jsonrpc:"2.0",id:2,method:"tools/list",params:{}}),signal:AbortSignal.timeout(15000)});
            const raw=await listed.text();
            let payload=null;
            try{payload=JSON.parse(raw);}catch{
              const data=raw.split(/\r?\n/).filter(line=>line.startsWith("data:")).map(line=>line.slice(5).trim()).filter(Boolean);
              if(data.length){try{payload=JSON.parse(data[data.length-1]);}catch{}}
            }
            const tools=payload?.result?.tools??[];
            mcpTools={status:listed.status,tools:tools.filter(t=>/^sites_/.test(t.name)).map(t=>({name:t.name,description:t.description,inputSchema:t.inputSchema})),error:payload?.error?.message??null};
          }
          const credential = await get("/api-keys/current");
          const projects = await get("/projects");
          const sites = await get("/sites");
          const billingCycles = await get("/billing/cycles");
          const summarize = (value, depth=0) => {
            if (depth>5 || value==null) return value;
            if (Array.isArray(value)) return value.slice(0,10).map(v=>summarize(v,depth+1));
            if (typeof value!=="object") return value;
            const out={};
            for(const [k,v] of Object.entries(value)) if (/(status|state|overdue|paused|plan|dueDate|paidAt|cycle|invoice|creation)/i.test(k)) out[k]=summarize(v,depth+1);
            return out;
          };
          const projectRows = rows(projects.body, ["projects","items"]);
          const gitConnections = await Promise.all(projectRows.map(async p => {
            const id = p.id ?? p.projectId;
            if (!id) return {project:p.name ?? null,accountsStatus:0,accounts:[]};
            const accounts = await get(`/projects/${encodeURIComponent(id)}/github/accounts`);
            return {project:p.name ?? p.projectName ?? null,accountsStatus:accounts.status,accounts:rows(accounts.body,["accounts","items"]).map(a=>({login:a.login ?? a.name ?? null}))};
          }));
          const safeSite = (site) => ({
            id: site.id ?? site.siteId ?? null,
            name: site.name ?? site.siteName ?? site.slug ?? null,
            status: site.status ?? site.state ?? null,
            url: site.url ?? site.siteUrl ?? site.publicUrl ?? null,
            projectId: site.projectId ?? site.project?.id ?? null,
            domains: (Array.isArray(site.domains) ? site.domains : []).map(d =>
              typeof d === "string" ? d : {
                domain: d.domain ?? d.hostname ?? d.name ?? null,
                status: d.status ?? d.state ?? null,
                verified: d.verified ?? d.isVerified ?? null
              })
          });
          const result = {
            account: process.env.LABEL,
            credential: {httpStatus:credential.status,kind:credential.body.kind ?? null,name:credential.body.name ?? null,prefix:credential.body.prefix ?? null,scopes:credential.body.scopes ?? [],projects:credential.body.projects ?? []},
            mcpTools,
            gitConnections,
            projects: {
              httpStatus: projects.status,
              items: rows(projects.body, ["projects","items"]).map(p => ({
                id:p.id ?? p.projectId ?? null,
                name:p.name ?? p.projectName ?? p.slug ?? null
              }))
            },
            billing: {cyclesStatus:billingCycles.status,cycles:summarize(billingCycles.body)},
            sites: {
              httpStatus: sites.status,
              items: rows(sites.body, ["sites","items"]).map(safeSite)
            }
          };
          console.log(JSON.stringify(result));
          if (sites.status === 401 || sites.status === 403) {
            console.log("Sites API access denied; no resource was changed.");
          }
          NODE
