name: Apollo donor inventory and REA evidence

on:
  workflow_dispatch:
    inputs:
      donor:
        description: Confirmed donor repository
        required: true
        type: choice
        options:
          - hearmeout
          - streamweaver
          - discord-stream-hub
      donor_ref:
        description: Donor branch, tag, or commit to inspect
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: apollo-donor-inventory-${{ inputs.donor }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Apollo tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve allowlisted donor
        id: donor
        env:
          DONOR_ID: ${{ inputs.donor }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const registry = JSON.parse(fs.readFileSync('config/apollo-donor-sources.v1.json', 'utf8'));
          const source = registry.sources.find(item => item.id === process.env.DONOR_ID && item.status === 'confirmed' && item.repository);
          if (!source) throw new Error('Donor is not in the confirmed read-only allowlist.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `repository=${source.repository}\nname=${source.name}\n`);
          NODE

      - name: Check out donor source read-only
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.donor.outputs.repository }}
          ref: ${{ inputs.donor_ref }}
          path: donor-source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Record donor provenance and file inventory
        env:
          DONOR_COMMIT_SHA: ${{ github.event.repository.default_branch }}
          DONOR_REPOSITORY: ${{ steps.donor.outputs.repository }}
          DONOR_REF: ${{ inputs.donor_ref }}
        run: |
          set -euo pipefail
          SHA="$(git -C donor-source rev-parse HEAD)"
          export DONOR_COMMIT_SHA="$SHA"
          node scripts/parity-donor-inventory.mjs \
            --root donor-source \
            --repository "$DONOR_REPOSITORY" \
            --ref "$DONOR_REF" \
            --output donor-inventory.json
          {
            echo "## Read-only donor inventory"
            echo
            echo "- Donor: $DONOR_REPOSITORY"
            echo "- Requested ref: $DONOR_REF"
            echo "- Resolved commit: $SHA"
            echo "- Source execution: disabled"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run REA static analysis against donor source
        run: |
          set -euo pipefail
          npm run parity:rea -- donor-source > donor-rea-analysis.json

      - name: Upload donor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: donor-evidence-${{ inputs.donor }}
          path: |
            donor-inventory.json
            donor-rea-analysis.json
          if-no-files-found: warn
          retention-days: 30
