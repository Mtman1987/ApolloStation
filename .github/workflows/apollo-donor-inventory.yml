name: Apollo donor inventory and REA evidence

on:
  workflow_dispatch:
    inputs:
      donor:
        description: Confirmed donor repository
        required: true
        type: choice
        options:
          - hearmeout
          - streamweaver
          - discord-stream-hub
      donor_ref:
        description: Donor branch, tag, or commit to inspect
        required: true
        default: main
        type: string
      apollo_app:
        description: Apollo app to compare
        required: true
        type: choice
        options:
          - apps/hearmeout
          - apps/streamweaver
          - apps/nebula-arcade
          - apps/discord-stream-hub

permissions:
  contents: read

concurrency:
  group: apollo-donor-inventory-${{ inputs.donor }}-${{ inputs.apollo_app }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Apollo tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve allowlisted donor
        id: donor
        env:
          DONOR_ID: ${{ inputs.donor }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const registry = JSON.parse(fs.readFileSync('config/apollo-donor-sources.v1.json', 'utf8'));
          const source = registry.sources.find(item => item.id === process.env.DONOR_ID && item.status === 'confirmed' && item.repository);
          if (!source) throw new Error('Donor is not in the confirmed read-only allowlist.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `repository=${source.repository}\nname=${source.name}\n`);
          NODE

      - name: Check out donor source read-only
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.donor.outputs.repository }}
          ref: ${{ inputs.donor_ref }}
          path: donor-source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build Apollo (donor code is never installed or run)
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Inventory exact donor and Apollo source commits
        env:
          DONOR_REPOSITORY: ${{ steps.donor.outputs.repository }}
          DONOR_REF: ${{ inputs.donor_ref }}
          APOLLO_APP: ${{ inputs.apollo_app }}
        run: |
          set -euo pipefail
          DONOR_SHA="$(git -C donor-source rev-parse HEAD)"
          export DONOR_COMMIT_SHA="$DONOR_SHA"
          node scripts/parity-donor-inventory.mjs --root donor-source --repository "$DONOR_REPOSITORY" --ref "$DONOR_REF" --output donor-inventory.json
          export DONOR_COMMIT_SHA="$(git rev-parse HEAD)"
          node scripts/parity-donor-inventory.mjs --root "$APOLLO_APP" --repository "Mtman1987/ApolloStation" --ref "$GITHUB_SHA:$APOLLO_APP" --output apollo-inventory.json
          node scripts/parity-compare-inventories.mjs donor-inventory.json apollo-inventory.json parity-comparison.json
          {
            echo "## Donor ↔ Apollo evidence"
            echo
            echo "- Donor: $DONOR_REPOSITORY@$DONOR_SHA"
            echo "- Apollo: $GITHUB_SHA ($APOLLO_APP)"
            echo "- Donor source execution: disabled"
            echo "- Comparison: path/hash heuristic only; not parity proof"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Analyze donor JavaScript with REA
        run: npm run parity:rea -- donor-source > donor-rea-analysis.json

      - name: Analyze built Apollo JavaScript with REA
        env:
          APOLLO_APP: ${{ inputs.apollo_app }}
        run: npm run parity:rea -- "$APOLLO_APP/dist" > apollo-rea-analysis.json

      - name: Upload complete parity evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-evidence-${{ inputs.donor }}-${{ inputs.apollo_app }}
          path: |
            donor-inventory.json
            apollo-inventory.json
            parity-comparison.json
            donor-rea-analysis.json
            apollo-rea-analysis.json
          if-no-files-found: warn
          retention-days: 30
