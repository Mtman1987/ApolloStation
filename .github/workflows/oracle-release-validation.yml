name: ApolloStation Oracle release validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-media-cache:
    name: Prepare shared FFmpeg package cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set weekly FFmpeg package cache key
        id: ffmpeg-cache-key
        run: echo "week=$(date -u +%Y-%W)" >> "$GITHUB_OUTPUT"
      - name: Restore cached FFmpeg packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ffmpeg-debs
          key: ffmpeg-debs-${{ runner.os }}-${{ runner.arch }}-${{ steps.ffmpeg-cache-key.outputs.week }}
          restore-keys: |
            ffmpeg-debs-${{ runner.os }}-${{ runner.arch }}-
      - name: Download and cache FFmpeg packages
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg-debs/partial"
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/ffmpeg-debs" install --yes ffmpeg
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/ffmpeg-debs"
          ffmpeg -version
          ffprobe -version

  validate:
    needs: [prepare-media-cache]
    name: Full test suite — shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 27
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Restore installed workspace dependencies
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install locked dependencies on cache miss
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Set weekly FFmpeg package cache key
        id: ffmpeg-cache-key
        run: echo "week=$(date -u +%Y-%W)" >> "$GITHUB_OUTPUT"
      - name: Restore cached FFmpeg packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ffmpeg-debs
          key: ffmpeg-debs-${{ runner.os }}-${{ runner.arch }}-${{ steps.ffmpeg-cache-key.outputs.week }}
          restore-keys: |
            ffmpeg-debs-${{ runner.os }}-${{ runner.arch }}-
      - name: Install media test tools
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg-debs/partial"
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/ffmpeg-debs" install --yes ffmpeg
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/ffmpeg-debs"
      - name: Verify media test tools
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Build all workspaces
        run: npm run build
      - name: Run all assigned tests and record pass/fail
        shell: bash
        run: |
          mkdir -p release-validation
          set -o pipefail
          node scripts/run-release-validation-shard.mjs "${{ matrix.shard }}" 4 2>&1 | tee "release-validation/shard-${{ matrix.shard }}.tap"
      - name: Upload shard log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oracle-validation-shard-${{ matrix.shard }}
          path: release-validation/shard-${{ matrix.shard }}.tap
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Aggregate release validation report
    if: ${{ always() }}
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Download shard logs
        uses: actions/download-artifact@v8
        with:
          pattern: oracle-validation-shard-*
          path: release-validation/logs
          merge-multiple: true
      - name: Create consolidated report
        run: node scripts/summarize-release-validation.mjs release-validation/logs release-validation/REPORT.md
      - name: Publish report in workflow summary
        if: always()
        run: cat release-validation/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload consolidated report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oracle-release-validation-report
          path: release-validation/REPORT.md
          if-no-files-found: error
          retention-days: 90
      - name: Enforce go/no-go
        run: |
          if [ "${{ needs.validate.result }}" != "success" ]; then
            echo "NO-GO: one or more test shards failed, were cancelled, or timed out."
            exit 1
          fi
          grep -q '^Overall result: PASS$' release-validation/REPORT.md
