name: Discord Bot Token Secret Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-secret-safely:
    runs-on: ubuntu-latest
    steps:
      - name: Create token metadata artifact (never expose token)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const token = process.env.DISCORD_BOT_TOKEN ?? '';
          const trimmed = token.trim();
          const metadata = {
            secret_present: token.length > 0,
            character_length: token.length,
            surrounding_whitespace: token !== trimmed,
            sha256_of_trimmed_value: trimmed ? crypto.createHash('sha256').update(trimmed).digest('hex') : null,
            inspected_at_utc: new Date().toISOString()
          };
          fs.mkdirSync('secret-proof', { recursive: true });
          fs.writeFileSync('secret-proof/discord-token-proof.json', JSON.stringify(metadata, null, 2));
          console.log(JSON.stringify(metadata, null, 2));
          NODE
      - name: Upload metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: discord-token-secret-proof
          path: secret-proof/discord-token-proof.json
          retention-days: 1
