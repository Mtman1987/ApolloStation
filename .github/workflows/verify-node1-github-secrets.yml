name: Verify Apollo Node 1 GitHub secret availability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-node1-secrets:
    name: Check Node 1 secret names (no deployment)
    runs-on: ubuntu-latest
    steps:
      - name: Check which GitHub Actions secrets are available
        env:
          HOSTLESS_NODE1_TOKEN: ${{ secrets.HOSTLESS_NODE1_TOKEN }}
          BOSS_KEY: ${{ secrets.BOSS_KEY }}
          SPMT_SESSION_BRIDGE_JSON: ${{ secrets.SPMT_SESSION_BRIDGE_JSON }}
          SPMT_WEBHOOK_KEY: ${{ secrets.SPMT_WEBHOOK_KEY }}
          SPMT_PROVIDER_CREDENTIAL_KEY: ${{ secrets.SPMT_PROVIDER_CREDENTIAL_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHAT_GATEWAY_WORKER_CREDENTIAL: ${{ secrets.CHAT_GATEWAY_WORKER_CREDENTIAL }}
          STREAMWEAVER_WORKER_CREDENTIAL: ${{ secrets.STREAMWEAVER_WORKER_CREDENTIAL }}
          NEBULA_ARCADE_WORKER_CREDENTIAL: ${{ secrets.NEBULA_ARCADE_WORKER_CREDENTIAL }}
          NODE1_TURSO_AUTH_TOKEN: ${{ secrets.NODE1_TURSO_AUTH_TOKEN }}
          DSH_WORKER_CREDENTIAL: ${{ secrets.DSH_WORKER_CREDENTIAL }}
          DSH_RUNTIME_CONFIG_JSON: ${{ secrets.DSH_RUNTIME_CONFIG_JSON }}
          DSH_DISCORD_PUBLIC_KEY: ${{ secrets.DSH_DISCORD_PUBLIC_KEY }}
          DSH_SERVICE_SECRET: ${{ secrets.DSH_SERVICE_SECRET }}
          DSH_RAID_PILE_STORE: ${{ secrets.DSH_RAID_PILE_STORE }}
          DSH_MTFIXIT_STORE: ${{ secrets.DSH_MTFIXIT_STORE }}
        run: |
          set -euo pipefail
          mkdir -p secret-check
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const required = [
            "HOSTLESS_NODE1_TOKEN",
            "BOSS_KEY",
            "SPMT_SESSION_BRIDGE_JSON",
            "SPMT_WEBHOOK_KEY",
            "SPMT_PROVIDER_CREDENTIAL_KEY",
            "TWITCH_CLIENT_ID",
            "TWITCH_CLIENT_SECRET",
            "DISCORD_CLIENT_ID",
            "DISCORD_CLIENT_SECRET",
            "DISCORD_BOT_TOKEN",
            "CHAT_GATEWAY_WORKER_CREDENTIAL",
            "STREAMWEAVER_WORKER_CREDENTIAL",
            "NEBULA_ARCADE_WORKER_CREDENTIAL",
            "NODE1_TURSO_AUTH_TOKEN",
            "DSH_WORKER_CREDENTIAL",
            "DSH_RUNTIME_CONFIG_JSON",
            "DSH_DISCORD_PUBLIC_KEY",
            "DSH_SERVICE_SECRET",
            "DSH_RAID_PILE_STORE",
            "DSH_MTFIXIT_STORE",
          ];
          const report = {
            checkedAt: new Date().toISOString(),
            scope: "GitHub Actions secrets exposed to this workflow run; not a Hostless read-back",
            secrets: required.map(name => ({
              name,
              present: typeof process.env[name] === "string" && process.env[name].length > 0,
            })),
          };
          report.presentCount = report.secrets.filter(item => item.present).length;
          report.missingCount = report.secrets.length - report.presentCount;
          writeFileSync("secret-check/node1-secret-presence.json", JSON.stringify(report, null, 2) + "\n");
          writeFileSync("secret-check/node1-secret-presence.txt",
            report.secrets.map(item => `${item.present ? "PRESENT" : "MISSING"}  ${item.name}`).join("\n") +
            `\n\nPresent: ${report.presentCount}/${report.secrets.length}\nMissing: ${report.missingCount}\n`);
          for (const item of report.secrets) {
            console.log(`${item.present ? "PRESENT" : "MISSING"}  ${item.name}`);
          }
          console.log(`Summary: ${report.presentCount}/${report.secrets.length} present; ${report.missingCount} missing.`);
          NODE
      - name: Save the name-only verification report
        uses: actions/upload-artifact@v4
        with:
          name: apollo-node1-github-secret-presence
          path: secret-check/
          if-no-files-found: error
          retention-days: 7
