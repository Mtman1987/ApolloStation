name: Import recovered JSON manifest to shared Turso

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Private GitHub release tag containing the verified recovery manifest"
        required: true
        type: string
        default: apollo-recovery-2026-11-07
      apply:
        description: "Write the verified redacted recovery manifest into the raw staging table"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apollo-recovered-json-import
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL || vars.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.NODE2_TURSO_AUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      RECOVERY_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Download the private recovery release asset
        run: |
          mkdir -p recovery-input
          gh release download "$RECOVERY_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "recovered-json-manifest.1.jsonl" \
            --dir recovery-input

      - name: Verify manifest checksum and Turso configuration
        run: |
          test -s recovery-input/recovered-json-manifest.1.jsonl || {
            echo "::error::The private release must contain recovered-json-manifest.1.jsonl."
            exit 1
          }
          echo "4e4385a54daa1e09ceb36bd2694e0c2dd576248a483cd1d4e8abd1ed3ef364f8  recovery-input/recovered-json-manifest.1.jsonl" | sha256sum -c -
          test -n "$TURSO_DATABASE_URL" || {
            echo "::error::Set the single shared TURSO_DATABASE_URL GitHub Actions secret or variable."
            exit 1
          }
          test -n "$TURSO_AUTH_TOKEN" || {
            echo "::error::NODE2_TURSO_AUTH_TOKEN is missing."
            exit 1
          }

      - name: Validate manifest without writing
        run: node scripts/import-recovered-json-manifest-to-turso.mjs --manifest recovery-input/recovered-json-manifest.1.jsonl

      - name: Apply and read back all 5,748 records
        if: inputs.apply
        run: node scripts/import-recovered-json-manifest-to-turso.mjs --manifest recovery-input/recovered-json-manifest.jsonl.gz --apply
