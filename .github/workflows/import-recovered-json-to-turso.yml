name: Import recovered JSON manifest to shared Turso

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Private GitHub release tag containing the verified recovery manifest"
        required: true
        type: string
        default: apollo-recovery-2026-11-07
      apply:
        description: "Write the verified redacted recovery manifest into the raw staging table"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apollo-recovered-json-import
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL || vars.TURSO_DATABASE_URL || 'libsql://apollo-persistence-spike-mtman1987.aws-us-east-1.turso.io' }}
      TURSO_AUTH_TOKEN: ${{ secrets.NODE2_TURSO_AUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      RECOVERY_RELEASE_TAG: ${{ inputs.release_tag || 'apollo-recovery-2026-11-07' }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Download supported private recovery manifest assets
        run: |
          set -euo pipefail
          mkdir -p recovery-input
          gh release download "$RECOVERY_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "recovered-json-manifest*.jsonl" \
            --pattern "recovered-json-manifest*.jsonl.gz" \
            --dir recovery-input
          mapfile -t manifests < <(find recovery-input -maxdepth 1 -type f \\( -name 'recovered-json-manifest*.jsonl' -o -name 'recovered-json-manifest*.jsonl.gz' \\) -print | sort)
          if [ "${#manifests[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one supported recovery manifest asset; found ${#manifests[@]}."
            printf '%s\\n' "${manifests[@]}"
            exit 1
          fi
          echo "RECOVERY_MANIFEST=${manifests[0]}" >> "$GITHUB_ENV"

      - name: Verify manifest and Turso configuration
        run: |
          set -euo pipefail
          test -s "$RECOVERY_MANIFEST" || {
            echo "::error::The selected recovery manifest is empty."
            exit 1
          }
          test -n "$TURSO_DATABASE_URL" || {
            echo "::error::Set the single shared TURSO_DATABASE_URL GitHub Actions secret or variable."
            exit 1
          }
          test -n "$TURSO_AUTH_TOKEN" || {
            echo "::error::NODE2_TURSO_AUTH_TOKEN is missing."
            exit 1
          }

      - name: Validate manifest without writing
        run: node scripts/import-recovered-json-manifest-to-turso.mjs --manifest "$RECOVERY_MANIFEST"

      - name: Apply and read back all 5,748 records
        if: ${{ inputs.apply == true }}
        run: node scripts/import-recovered-json-manifest-to-turso.mjs --manifest "$RECOVERY_MANIFEST" --apply
