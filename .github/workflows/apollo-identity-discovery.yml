name: Apollo identity discovery (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe configured identity providers and Apollo
        env:
          SPMT_SESSION_BRIDGE_JSON: ${{ secrets.SPMT_SESSION_BRIDGE_JSON }}
          DISCORD_USER_ACCESS_TOKEN: ${{ secrets.DISCORD_USER_ACCESS_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          TWITCH_ACCESS_TOKEN: ${{ secrets.TWITCH_ACCESS_TOKEN }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          KICK_ACCESS_TOKEN: ${{ secrets.KICK_ACCESS_TOKEN }}
          YOUTUBE_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
          GOOGLE_ACCESS_TOKEN: ${{ secrets.GOOGLE_ACCESS_TOKEN }}
          APOLLO_NODE1_URL: https://apollo-node-1.hostless.app
        run: node scripts/diagnostics/identity-discovery.mjs
      - name: Upload redacted identity report
        uses: actions/upload-artifact@v4
        with:
          name: apollo-identity-discovery
          path: identity-diagnostics/report.json
          if-no-files-found: error
          retention-days: 7
