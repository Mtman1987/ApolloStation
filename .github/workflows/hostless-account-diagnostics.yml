name: Hostless account entitlement diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hostless-account-diagnostics.yml"

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    name: Read-only Hostless account diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: Node 1
            secret: HOSTLESS_NODE1_TOKEN
          - node: Node 2
            secret: HOSTLESS_NODE2_TOKEN
    steps:
      - name: Inspect billing entitlement and app inventory (read only)
        env:
          HOSTLESS_TOKEN: ${{ secrets[matrix.secret] }}
          NODE_LABEL: ${{ matrix.node }}
        run: |
          node --input-type=module <<'NODE'
          const base = "https://api.hostless.cloud/v1";
          const token = process.env.HOSTLESS_TOKEN;
          if (!token) { console.log(process.env.NODE_LABEL + ": token missing"); process.exit(1); }
          const paths = [
            "/billing/cycles",
            "/billing/breakdown?startDate=2026-11-01&endDate=2026-11-30",
            "/billing/payment-config",
            "/apps",
            "/apps/" + encodeURIComponent(process.env.APP) + "/environment-variables"
          ];
          const safe = (value, depth = 0) => {
            if (depth > 7 || value == null) return value;
            if (Array.isArray(value)) return value.slice(0, 30).map(v => safe(v, depth + 1));
            if (typeof value !== "object") return typeof value === "string" ? value.slice(0, 300) : value;
            const out = {};
            for (const [k,v] of Object.entries(value)) {
              if (/(token|secret|password|authorization|cookie|cardnumber|cvc|cvv|email|phone|address|paymentmethodid|clientsecret)/i.test(k)) {
                out[k] = "[redacted]";
              } else {
                out[k] = safe(v, depth + 1);
              }
            }
            return out;
          };
          console.log("=== " + process.env.NODE_LABEL + " ===");
          for (const path of paths) {
            try {
              const response = await fetch(base + path, {
                headers: { Authorization: token, Accept: "application/json" }
              });
              const raw = await response.text();
              let body;
              try { body = raw ? JSON.parse(raw) : {}; } catch { body = { nonJsonResponse: true }; }
              if (path.endsWith("/environment-variables")) {
                const rows = Array.isArray(body) ? body
                  : Array.isArray(body?.variables) ? body.variables
                  : Array.isArray(body?.environmentVariables) ? body.environmentVariables
                  : Array.isArray(body?.items) ? body.items
                  : Array.isArray(body?.data?.variables) ? body.data.variables
                  : Array.isArray(body?.data?.environmentVariables) ? body.data.environmentVariables
                  : Array.isArray(body?.data?.items) ? body.data.items
                  : Array.isArray(body?.data) ? body.data : null;
                const names = rows ? [...new Set(rows.map(item => typeof item?.name === "string" ? item.name : typeof item?.key === "string" ? item.key : "").filter(Boolean))].sort() : [];
                mkdirSync("hostless-inventory", { recursive: true });
                const inventory = { checkedAt: new Date().toISOString(), node: process.env.NODE_LABEL, app: process.env.APP, httpStatus: response.status, count: names.length, names };
                writeFileSync("hostless-inventory/" + process.env.APP + "-environment-variable-names.json", JSON.stringify(inventory, null, 2) + "\n");
                writeFileSync("hostless-inventory/" + process.env.APP + "-environment-variable-names.txt", names.join("\n") + "\n");
                console.log(JSON.stringify({ endpoint: path.split("?")[0], httpStatus: response.status, count: names.length, names }));
                if (!response.ok || !rows) process.exitCode = 1;
                continue;
              }
              console.log(JSON.stringify({ endpoint: path.split("?")[0], httpStatus: response.status, result: safe(body) }));
            } catch (error) {
              console.log(JSON.stringify({ endpoint: path.split("?")[0], networkError: String(error).slice(0, 180) }));
            }
          }
          NODE
      - name: Upload name-only Hostless environment inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostless-environment-names-${{ matrix.app }}-${{ github.run_id }}
          path: hostless-inventory/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish node result pointer to Apollo diagnostics issue
        if: always()
        uses: actions/github-script@v7
        env:
          NODE_LABEL: ${{ matrix.node }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = 'Hostless Node 1 / Node 2 diagnostics';
            const body = [
              'Read-only Hostless diagnostics executed for **' + process.env.NODE_LABEL + '**.',
              '',
              '- Run: ' + context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId,
              '- Commit: ' + context.sha,
              '- Matrix target: ' + process.env.NODE_LABEL,
              '',
              'Open the run and select the matching matrix job to read the endpoint HTTP statuses and redacted response summaries.'
            ].join('\\n');
            const found = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = found.data.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
