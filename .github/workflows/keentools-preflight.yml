name: KeenTools API Preflight
run-name: KeenTools preflight — check access without reconstruction

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keentools-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate KeenTools access without processing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate manifest and KeenTools API access
        env:
          STREAMWEAVER_KEENTOOLS_API_KEY_SECOND: ${{ secrets.STREAMWEAVER_KEENTOOLS_API_KEY_SECOND }}
        run: node .github/scripts/keentools-preflight.mjs
