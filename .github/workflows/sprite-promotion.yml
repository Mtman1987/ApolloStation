name: Release Sprite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release Sprite
    if: github.ref == 'refs/heads/main' && vars.SPRITES_AUTODEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: apollo-release-sprite
      cancel-in-progress: false
    environment: sprite-release
    env:
      SPRITE_ORG: testing-968
      SPRITE_NAME: web-terminal
      EXPECTED_SPRITE_ID: sprite-fec8d6f2-49f0-4e28-bc6d-e8a7ae364280
      SPRITE_PUBLIC_URL: https://web-terminal-bvesa.sprites.app
      DEPLOY_ROLE: release
      BUILD_SHA: ${{ github.sha }}
      REPOSITORY_URL: https://github.com/${{ github.repository }}.git
      SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
    steps:
      - name: Require main for release promotion
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Release promotion is permitted only from main." >&2
          exit 1

      - name: Check out deployment tooling
        uses: actions/checkout@v5

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SPRITES_TOKEN:-}" ]]; then
            echo "Missing SPRITES_TOKEN in the sprite-release environment." >&2
            exit 1
          fi

      - name: Install Sprites CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://sprites.dev/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Authenticate and verify protected target
        shell: bash
        run: |
          set -euo pipefail
          sprite auth setup --token "$SPRITES_TOKEN"
          actual_id="$(sprite api "/v1/sprites/$SPRITE_NAME" -- --silent | jq -r '.id')"
          if [[ "$actual_id" != "$EXPECTED_SPRITE_ID" ]]; then
            echo "Refusing deployment: $SPRITE_NAME resolved to unexpected ID $actual_id" >&2
            exit 1
          fi
          url_details="$(sprite url -o "$SPRITE_ORG" -s "$SPRITE_NAME")"
          grep -Fq "$SPRITE_PUBLIC_URL" <<<"$url_details"
          grep -Eiq 'auth[^[:alnum:]]+(sprite|public)|(sprite|public)[^[:alnum:]]+auth' <<<"$url_details"

      - name: Create protected pre-promotion checkpoint
        shell: bash
        run: |
          set -euo pipefail
          checkpoint_log="$(mktemp)"
          set +e
          sprite checkpoint create -o "$SPRITE_ORG" -s "$SPRITE_NAME" --comment "Before release $BUILD_SHA" 2>&1 | tee "$checkpoint_log"
          checkpoint_status=${PIPESTATUS[0]}
          set -e
          if (( checkpoint_status != 0 )); then
            if ! grep -Fq 'file exists' "$checkpoint_log"; then
              exit "$checkpoint_status"
            fi
            checkpoints="$(curl -fsS -H "Authorization: Bearer $SPRITES_TOKEN" "https://api.sprites.dev/v1/sprites/$SPRITE_NAME/checkpoints")"
            if [[ "$(jq 'length' <<<"$checkpoints")" -lt 1 ]]; then
              echo "Checkpoint collision reported but no rollback checkpoint exists." >&2
              exit "$checkpoint_status"
            fi
            echo "Sprites reported a duplicate checkpoint version; preserving the existing rollback checkpoint and continuing."
          fi

      - name: Apply model-safe deny-by-default network policy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST "https://api.sprites.dev/v1/sprites/$SPRITE_NAME/policy/network" \
            -H "Authorization: Bearer $SPRITES_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @sandbox/sprites/network-policy.json >/tmp/network-policy-response.json
          curl -fsS "https://api.sprites.dev/v1/sprites/$SPRITE_NAME/policy/network" \
            -H "Authorization: Bearer $SPRITES_TOKEN" | jq -S . >/tmp/network-policy-actual.json
          jq -S . sandbox/sprites/network-policy.json >/tmp/network-policy-expected.json
          diff -u /tmp/network-policy-expected.json /tmp/network-policy-actual.json

      - name: Install private flow authoring credential when configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${OPENAI_API_KEY:-}" ]]; then
            umask 077
            python3 -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"apollo-openai-key").write_text(os.environ["OPENAI_API_KEY"])'
            sprite exec --no-port-forward -o "$SPRITE_ORG" -s "$SPRITE_NAME" \
              --file "$RUNNER_TEMP/apollo-openai-key:/tmp/apollo-openai-key" \
              -- /bin/bash -c 'umask 077; mkdir -p /home/sprite/data/release; install -m 600 /tmp/apollo-openai-key /home/sprite/data/release/openai-api-key; rm -f /tmp/apollo-openai-key'
            rm -f "$RUNNER_TEMP/apollo-openai-key"
          else
            echo "OPENAI_API_KEY is not configured in Actions; preserving any existing private Sprite credential."
          fi

      - name: Install dedicated avatar AI credentials when configured
        env:
          STREAMWEAVER_MESHY_API_KEY: ${{ secrets.STREAMWEAVER_MESHY_API_KEY }}
          STREAMWEAVER_KEENTOOLS_API_KEY: ${{ secrets.STREAMWEAVER_KEENTOOLS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${STREAMWEAVER_MESHY_API_KEY:-}" && -n "${STREAMWEAVER_KEENTOOLS_API_KEY:-}" ]]; then
            umask 077
            python3 -c 'import os,pathlib; root=pathlib.Path(os.environ["RUNNER_TEMP"]); (root/"apollo-meshy-key").write_text(os.environ["STREAMWEAVER_MESHY_API_KEY"]); (root/"apollo-keentools-key").write_text(os.environ["STREAMWEAVER_KEENTOOLS_API_KEY"])'
            sprite exec --no-port-forward -o "$SPRITE_ORG" -s "$SPRITE_NAME" \
              --file "$RUNNER_TEMP/apollo-meshy-key:/tmp/apollo-meshy-key" \
              --file "$RUNNER_TEMP/apollo-keentools-key:/tmp/apollo-keentools-key" \
              -- /bin/bash -c 'umask 077; mkdir -p /home/sprite/data/release; install -m 600 /tmp/apollo-meshy-key /home/sprite/data/release/streamweaver-meshy-api-key; install -m 600 /tmp/apollo-keentools-key /home/sprite/data/release/streamweaver-keentools-api-key; rm -f /tmp/apollo-meshy-key /tmp/apollo-keentools-key'
            rm -f "$RUNNER_TEMP/apollo-meshy-key" "$RUNNER_TEMP/apollo-keentools-key"
          elif [[ -n "${STREAMWEAVER_MESHY_API_KEY:-}" || -n "${STREAMWEAVER_KEENTOOLS_API_KEY:-}" ]]; then
            echo "Configure both StreamWeaver avatar AI credentials together." >&2
            exit 1
          else
            echo "Avatar AI credentials are not configured in Actions; preserving any existing private Sprite credentials."
          fi

      - name: Promote and verify exact main commit
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          run_root="/home/sprite/data/release/deploy-runs/$BUILD_SHA"
          sprite exec --no-port-forward \
            -o "$SPRITE_ORG" -s "$SPRITE_NAME" \
            --file scripts/sprites/deploy-sandbox-release.sh:/tmp/deploy-sandbox-release.sh \
            --file scripts/sprites/start-detached-release.sh:/tmp/start-detached-release.sh \
            --env "DEPLOY_ROLE=$DEPLOY_ROLE,BUILD_SHA=$BUILD_SHA,REPOSITORY_URL=$REPOSITORY_URL,SPRITE_PUBLIC_URL=$SPRITE_PUBLIC_URL" \
            -- /bin/bash /tmp/start-detached-release.sh

          deadline=$((SECONDS + 20 * 60))
          while (( SECONDS < deadline )); do
            set +e
            state="$(sprite exec --no-port-forward -o "$SPRITE_ORG" -s "$SPRITE_NAME" -- /bin/bash -c "cat '$run_root/status' 2>/dev/null || printf running" 2>/dev/null)"
            poll_status=$?
            set -e
            if (( poll_status != 0 )); then
              echo "Sprite status connection dropped; retrying."
              sleep 10
              continue
            fi
            state="$(tr -d '\r\n[:space:]' <<<"$state")"
            if [[ "$state" == "0" ]]; then
              sprite exec --no-port-forward -o "$SPRITE_ORG" -s "$SPRITE_NAME" -- tail -n 80 "$run_root/deploy.log"
              break
            fi
            if [[ "$state" =~ ^[1-9][0-9]*$ ]]; then
              sprite exec --no-port-forward -o "$SPRITE_ORG" -s "$SPRITE_NAME" -- tail -n 160 "$run_root/deploy.log" || true
              echo "Remote release failed with exit code $state." >&2
              exit "$state"
            fi
            sleep 10
          done
          if (( SECONDS >= deadline )); then
            sprite exec --no-port-forward -o "$SPRITE_ORG" -s "$SPRITE_NAME" -- tail -n 160 "$run_root/deploy.log" || true
            echo "Remote release did not finish within 20 minutes." >&2
            exit 124
          fi

      - name: Open the Apollo test entry
        shell: bash
        run: |
          set -euo pipefail
          sprite config update -o "$SPRITE_ORG" -s "$SPRITE_NAME" --url-auth public

      - name: Record test deployment
        shell: bash
        run: |
          {
            echo "### Release Sprite"
            echo "- Commit: \`$BUILD_SHA\`"
            echo "- Target: \`$SPRITE_ORG/$SPRITE_NAME\`"
            echo "- URL: $SPRITE_PUBLIC_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify promoted public entry
        run: node scripts/sprites/verify-hearmeout-broadcast-test.mjs "$SPRITE_PUBLIC_URL" "$BUILD_SHA"
