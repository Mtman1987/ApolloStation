          APOLLO_RUNTIME_SHARED_TWITCH_EVENTSUB_SECRET: ${{ secrets.TWITCH_EVENTSUB_SECRET }}
          APOLLO_RUNTIME_SHARED_TWITCH_REDIRECT_URI: ${{ secrets.TWITCH_REDIRECT_URI }}
          APOLLO_RUNTIME_SHARED_USE_TTS_PLAYER: ${{ secrets.USE_TTS_PLAYER }}
          APOLLO_RUNTIME_SHARED_VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
