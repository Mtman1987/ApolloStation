          APOLLO_RUNTIME_SHARED_NODE1_TURSO_AUTH_TOKEN: ${{ secrets.NODE1_TURSO_AUTH_TOKEN }}
          APOLLO_RUNTIME_SHARED_NODE2_TURSO_AUTH_TOKEN: ${{ secrets.NODE2_TURSO_AUTH_TOKEN }}
          APOLLO_RUNTIME_SHARED_NODE3_TURSO_AUTH_TOKEN: ${{ secrets.NODE3_TURSO_AUTH_TOKEN }}
          APOLLO_RUNTIME_SHARED_OBS_WS_URL: ${{ secrets.OBS_WS_URL }}
          APOLLO_RUNTIME_SHARED_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          APOLLO_RUNTIME_SHARED_POKEMON_COLLECTION_OVERLAY_SCENE: ${{ secrets.POKEMON_COLLECTION_OVERLAY_SCENE }}
          APOLLO_RUNTIME_SHARED_POKEMON_COLLECTION_OVERLAY_SOURCE: ${{ secrets.POKEMON_COLLECTION_OVERLAY_SOURCE }}
          APOLLO_RUNTIME_SHARED_POKEMON_PACK_OVERLAY_SCENE: ${{ secrets.POKEMON_PACK_OVERLAY_SCENE }}
          APOLLO_RUNTIME_SHARED_POKEMON_PACK_OVERLAY_SOURCE: ${{ secrets.POKEMON_PACK_OVERLAY_SOURCE }}
          APOLLO_RUNTIME_SHARED_POKEMON_TRADE_OVERLAY_SCENE: ${{ secrets.POKEMON_TRADE_OVERLAY_SCENE }}
          APOLLO_RUNTIME_SHARED_POKEMON_TRADE_OVERLAY_SOURCE: ${{ secrets.POKEMON_TRADE_OVERLAY_SOURCE }}
          APOLLO_RUNTIME_SHARED_SHOTSTACK_API_KEY: ${{ secrets.SHOTSTACK_API_KEY }}
          APOLLO_RUNTIME_SHARED_SHOUTOUT_BROWSER_SOURCE: ${{ secrets.SHOUTOUT_BROWSER_SOURCE }}
          APOLLO_RUNTIME_SHARED_SHOUTOUT_SCENE: ${{ secrets.SHOUTOUT_SCENE }}
          APOLLO_RUNTIME_SHARED_SPMT_PROVIDER_CREDENTIAL_KEY: ${{ secrets.SPMT_PROVIDER_CREDENTIAL_KEY }}
          APOLLO_RUNTIME_SHARED_SPMT_SESSION_BRIDGE_JSON: ${{ secrets.SPMT_SESSION_BRIDGE_JSON }}
          APOLLO_RUNTIME_SHARED_SPMT_WEBHOOK_KEY: ${{ secrets.SPMT_WEBHOOK_KEY }}
          APOLLO_RUNTIME_SHARED_STREAMWEAVER_KEENTOOLS_API_KEY: ${{ secrets.STREAMWEAVER_KEENTOOLS_API_KEY }}
          APOLLO_RUNTIME_SHARED_STREAMWEAVER_KEENTOOLS_API_KEY_SECOND: ${{ secrets.STREAMWEAVER_KEENTOOLS_API_KEY_SECOND }}
          APOLLO_RUNTIME_SHARED_STREAMWEAVER_WORKER_CREDENTIAL: ${{ secrets.STREAMWEAVER_WORKER_CREDENTIAL }}
          APOLLO_RUNTIME_SHARED_TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
