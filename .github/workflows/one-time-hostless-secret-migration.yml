          APOLLO_RUNTIME_SHARED_NEXT_PUBLIC_STREAMWEAVE_WS_HOST: ${{ secrets.NEXT_PUBLIC_STREAMWEAVE_WS_HOST }}
          APOLLO_RUNTIME_SHARED_NEXT_PUBLIC_STREAMWEAVE_WS_PORT: ${{ secrets.NEXT_PUBLIC_STREAMWEAVE_WS_PORT }}
          APOLLO_RUNTIME_SHARED_NEXT_PUBLIC_STREAMWEAVE_WS_URL: ${{ secrets.NEXT_PUBLIC_STREAMWEAVE_WS_URL }}
          APOLLO_RUNTIME_SHARED_NEXT_PUBLIC_TWITCH_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_TWITCH_CLIENT_ID }}
          APOLLO_RUNTIME_SHARED_NEXT_PUBLIC_USE_TTS_PLAYER: ${{ secrets.NEXT_PUBLIC_USE_TTS_PLAYER }}
          APOLLO_RUNTIME_SHARED_NEXT_PUBLIC_WEBSOCKET_URL: ${{ secrets.NEXT_PUBLIC_WEBSOCKET_URL }}
