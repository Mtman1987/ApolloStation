name: One-time GitHub to Hostless secret migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type MIGRATE to copy repository Actions secrets into both Hostless nodes"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apollo-hostless-secret-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'MIGRATE' }}
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - node: node1
            app: apollo-node-1
            hostless_secret: HOSTLESS_NODE1_TOKEN
          - node: node2
            app: apollo-node-2
            hostless_secret: HOSTLESS_NODE2_TOKEN
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Hostless CLI
        run: |
          curl -fsSL https://hostless.cloud/install.sh | bash
          hostless --version
      - name: Copy configured Actions secrets and verify Hostless names
        env:
          HOSTLESS_TOKEN: ${{ secrets[matrix.hostless_secret] }}
          HOSTLESS_NODE1_TOKEN: ${{ secrets.HOSTLESS_NODE1_TOKEN }}
          APOLLO_SYNC_RUNTIME_SECRETS: "1"
          APOLLO_SYNC_ONLY: "1"
          APOLLO_RUNTIME_SHARED_ALLOW_DATA_FILE_IO: ${{ secrets.ALLOW_DATA_FILE_IO }}
          APOLLO_RUNTIME_SHARED_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APOLLO_RUNTIME_SHARED_APOLLO_PREVIEW_PASSWORD: ${{ secrets.APOLLO_PREVIEW_PASSWORD }}
          APOLLO_RUNTIME_SHARED_BOSS_KEY: ${{ secrets.BOSS_KEY }}
          APOLLO_RUNTIME_SHARED_BOT_SECRET_KEY: ${{ secrets.BOT_SECRET_KEY }}
          APOLLO_RUNTIME_SHARED_BRB_BROWSER_SOURCE: ${{ secrets.BRB_BROWSER_SOURCE }}
          APOLLO_RUNTIME_SHARED_BRB_SCENE: ${{ secrets.BRB_SCENE }}
          APOLLO_RUNTIME_SHARED_CHAT_GATEWAY_WORKER_CREDENTIAL: ${{ secrets.CHAT_GATEWAY_WORKER_CREDENTIAL }}
          APOLLO_RUNTIME_SHARED_DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
          APOLLO_RUNTIME_SHARED_DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          APOLLO_RUNTIME_SHARED_DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          APOLLO_RUNTIME_SHARED_DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          APOLLO_RUNTIME_SHARED_DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          APOLLO_RUNTIME_SHARED_DISCORD_HEAD_UPLOAD_WEBHOOK: ${{ secrets.DISCORD_HEAD_UPLOAD_WEBHOOK }}
          APOLLO_RUNTIME_SHARED_DISCORD_INVITE_LINK: ${{ secrets.DISCORD_INVITE_LINK }}
          APOLLO_RUNTIME_SHARED_DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          APOLLO_RUNTIME_SHARED_DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          APOLLO_RUNTIME_SHARED_DSH_SERVICE_SECRET: ${{ secrets.DSH_SERVICE_SECRET }}
          APOLLO_RUNTIME_SHARED_DSH_WORKER_CREDENTIAL: ${{ secrets.DSH_WORKER_CREDENTIAL }}
          APOLLO_RUNTIME_SHARED_EDENAI_API_KEY: ${{ secrets.EDENAI_API_KEY }}
          APOLLO_RUNTIME_SHARED_FREE_CONVERT_API_KEY: ${{ secrets.FREE_CONVERT_API_KEY }}
          APOLLO_RUNTIME_SHARED_GAMBLE_OVERLAY_SCENE: ${{ secrets.GAMBLE_OVERLAY_SCENE }}
          APOLLO_RUNTIME_SHARED_GAMBLE_OVERLAY_SOURCE: ${{ secrets.GAMBLE_OVERLAY_SOURCE }}
          APOLLO_RUNTIME_SHARED_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APOLLO_RUNTIME_SHARED_GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          APOLLO_RUNTIME_SHARED_GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          APOLLO_RUNTIME_SHARED_GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          APOLLO_RUNTIME_SHARED_GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
          APOLLO_RUNTIME_SHARED_GOOGLE_GENAI_MODEL: ${{ secrets.GOOGLE_GENAI_MODEL }}
          APOLLO_RUNTIME_SHARED_HARDCODED_GUILD_ID: ${{ secrets.HARDCODED_GUILD_ID }}
          APOLLO_RUNTIME_SHARED_INTERNAL_API_BASE_URL: ${{ secrets.INTERNAL_API_BASE_URL }}
          APOLLO_RUNTIME_SHARED_INWORLD_BASE64_API_KEY: ${{ secrets.INWORLD_BASE64_API_KEY }}
          APOLLO_RUNTIME_SHARED_INWORLD_JET_SECRET: ${{ secrets.INWORLD_JET_SECRET }}
          APOLLO_RUNTIME_SHARED_INWORLD_JWT_API_KEY: ${{ secrets.INWORLD_JWT_API_KEY }}
          APOLLO_RUNTIME_SHARED_KOKORO_AUTH_TOKEN: ${{ secrets.KOKORO_AUTH_TOKEN }}
          APOLLO_RUNTIME_SHARED_LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          APOLLO_RUNTIME_SHARED_LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          APOLLO_RUNTIME_SHARED_LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          APOLLO_RUNTIME_SHARED_NEBULA_ARCADE_WORKER_CREDENTIAL: ${{ secrets.NEBULA_ARCADE_WORKER_CREDENTIAL }}
          APOLLO_RUNTIME_SHARED_NEXT_DEFAULT_TTS_VOICE: ${{ secrets.NEXT_DEFAULT_TTS_VOICE }}
          APOLLO_RUNTIME_SHARED_NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          APOLLO_RUNTIME_SHARED_NEXT_PUBLIC_DISCORD_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_DISCORD_CLIENT_ID }}
          APOLLO_RUNTIME_SHARED_NEXT_PUBLIC_HARDCODED_GUILD_ID: ${{ secrets.NEXT_PUBLIC_HARDCODED_GUILD_ID }}
          APOLLO_RUNTIME_SHARED_NEXT_PUBLIC_STREAMWEAVE_PORT: ${{ secrets.NEXT_PUBLIC_STREAMWEAVE_PORT }}
