name: Deploy SpaceMountain static entrance

on:
  push:
    branches: [main]
    paths:
      - "static/spacemountain-entrance/**"
      - ".github/workflows/deploy-spacemountain-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: spacemountain-github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static entrance
        uses: actions/upload-pages-artifact@v3
        with:
          path: static/spacemountain-entrance
      - name: Publish static entrance
        id: deployment
        uses: actions/deploy-pages@v4
