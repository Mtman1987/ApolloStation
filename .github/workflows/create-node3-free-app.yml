name: Create Node 3 free Hostless app

on:
  push:
    branches: [main]
    paths:
      - "scripts/hostless/create-node3-app.sh"
      - ".github/workflows/create-node3-free-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-node3:
    name: Create Node3 app only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out ApolloStation
        uses: actions/checkout@v4
      - name: Install Hostless CLI
        run: |
          curl -fsSL https://hostless.cloud/install.sh | bash
          hostless --version
      - name: Create Node3 app
        env:
          HOSTLESS_TOKEN: ${{ secrets.HOSTLESS_NODE3_TOKEN }}
        run: bash scripts/hostless/create-node3-app.sh
