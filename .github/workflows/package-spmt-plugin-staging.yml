name: Package SPMT Ecosystem Plugin Staging

on:
  push:
    branches:
      - chore/spmt-ecosystem-plugin-0.3.1-package
    paths:
      - 'plugin-release/spmt-ecosystem-0.3.1/**'
      - '.github/workflows/package-spmt-plugin-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Create Plugin Creator ZIP
        run: |
          cd plugin-release/spmt-ecosystem-0.3.1
          test -f plugin.json
          zip -r ../../spmt-ecosystem-plugin-0.3.1.zip .

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: spmt-ecosystem-plugin-0.3.1
          path: spmt-ecosystem-plugin-0.3.1.zip
          if-no-files-found: error
          retention-days: 14
