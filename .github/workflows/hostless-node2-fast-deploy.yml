name: ApolloStation Hostless Node 2 fast deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/chat-gateway/**"
      - "apps/streamweaver/**"
      - "apps/nebula-arcade/**"
      - "scripts/hostless/start-node.mjs"
      - ".github/workflows/hostless-node2-fast-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apollo-hostless-node2-fast-deploy
  cancel-in-progress: false

jobs:
  deploy-node2:
    name: Deploy Node 2 only — Chat Gateway / StreamWeaver
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
      - name: Check out the exact Node 2 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Node 2 launch helpers
        run: |
          node --check scripts/hostless/ensure-node-app.mjs
          node --check scripts/hostless/start-node.mjs
          node -e 'const s=require("./package.json").scripts||{}; if(!s["hostless:node2"]) process.exit(1)'
      - name: Validate supplied Nebula Twitch channel mapping before touching Hostless
        env:
          NEBULA_ARCADE_RUNTIME_CONFIG_JSON: ${{ secrets.NEBULA_ARCADE_RUNTIME_CONFIG_JSON }}
          NEBULA_ARCADE_TENANT_ID: ${{ secrets.NEBULA_ARCADE_TENANT_ID }}
          NEBULA_ARCADE_CHANNEL_ID: ${{ secrets.NEBULA_ARCADE_CHANNEL_ID }}
          CHAT_GATEWAY_CONNECTIONS: ${{ secrets.CHAT_GATEWAY_CONNECTIONS }}
        run: |
          node --input-type=module - <<'NODE'
          const raw = process.env.NEBULA_ARCADE_RUNTIME_CONFIG_JSON?.trim();
          const tenantId = process.env.NEBULA_ARCADE_TENANT_ID?.trim();
          const connectionsRaw = process.env.CHAT_GATEWAY_CONNECTIONS?.trim();
          if (!raw && (!tenantId || !connectionsRaw)) {
            console.log("No Actions-side Nebula mapping supplied; preserving existing Hostless runtime configuration and allowing safe owner-only startup.");
            process.exit(0);
          }
          let config;
          if (raw) {
            try { config = JSON.parse(raw); } catch {
              console.error("NEBULA_ARCADE_RUNTIME_CONFIG_JSON must be valid JSON when supplied.");
              process.exit(1);
            }
          } else {
            let connections;
            try { connections = JSON.parse(connectionsRaw); } catch {
              console.error("CHAT_GATEWAY_CONNECTIONS must be valid JSON when supplied.");
              process.exit(1);
            }
            const channels = Array.isArray(connections) ? connections.filter(c =>
              c && c.schemaVersion === 1 && c.provider === "twitch" && c.desired === true && c.tenantId === tenantId
            ) : [];
            config = {
              schemaVersion: 1,
              revision: "hostless-chat-gateway-connection-registry-v1",
              tenants: channels.length ? [{
                tenantId,
                channels: channels.map(c => ({
                  provider: "twitch", connectionId: c.connectionId, channelId: c.channelId,
                  stateChannelId: process.env.NEBULA_ARCADE_CHANNEL_ID || c.channelId,
                  enabledGameIds: ["tag","quackverse","bingo","chaosmode","chatgarden","chatwars","chickenroyale","colorsymphony","colorwars","dancingparade","emojirain","emojitower","memorylane","petrace","phraseguess","pixelbattle","rhythmpulse","treasurehunt","wordchain","wordstorm"]
                }))
              }] : []
            };
          }
          if (config?.schemaVersion !== 1 || !Array.isArray(config.tenants)) {
            console.error("Nebula runtime config must be a version 1 tenant configuration.");
            process.exit(1);
          }
          if (config.tenants.length && !config.tenants.some(t => t?.tenantId && Array.isArray(t.channels) && t.channels.some(c =>
            c.provider === "twitch" && c.connectionId && c.channelId && c.stateChannelId &&
            Array.isArray(c.enabledGameIds) && c.enabledGameIds.length
          ))) {
            console.error("Supplied Nebula runtime config contains no complete Twitch channel mapping.");
            process.exit(1);
          }
          console.log("Supplied Nebula runtime configuration validated; values were not printed.");
          NODE
      - name: Install Hostless CLI
        run: |
          curl -fsSL https://hostless.cloud/install.sh | bash
          hostless --version
      - name: Deploy Node 2 using existing runtime secrets
        env:
          HOSTLESS_TOKEN: ${{ secrets.HOSTLESS_NODE2_TOKEN }}
          HOSTLESS_NODE1_TOKEN: ${{ secrets.HOSTLESS_NODE1_TOKEN }}
          APOLLO_RUNTIME_NODE2_SPMT_ORIGIN: ${{ secrets.SPMT_ORIGIN }}
          APOLLO_RUNTIME_NODE2_CHAT_GATEWAY_DATABASE_PATH: "/tmp/apollo-chat-gateway.sqlite"
          APOLLO_RUNTIME_NODE2_CHAT_GATEWAY_WORKER_CREDENTIAL: ${{ secrets.CHAT_GATEWAY_WORKER_CREDENTIAL }}
          APOLLO_RUNTIME_NODE2_STREAMWEAVER_PROVIDER_RUNTIME_ENABLED: "1"
          APOLLO_RUNTIME_NODE2_STREAMWEAVER_DATABASE_PATH: "/tmp/apollo-streamweaver.sqlite"
          APOLLO_RUNTIME_NODE2_STREAMWEAVER_WORKER_CREDENTIAL: ${{ secrets.STREAMWEAVER_WORKER_CREDENTIAL }}
          APOLLO_RUNTIME_NODE2_NEBULA_ARCADE_PROVIDER_RUNTIME_ENABLED: "1"
          APOLLO_RUNTIME_NODE2_NEBULA_ARCADE_WORKER_CREDENTIAL: ${{ secrets.NEBULA_ARCADE_WORKER_CREDENTIAL }}
          APOLLO_RUNTIME_NODE2_NEBULA_ARCADE_TENANT_ID: ${{ secrets.NEBULA_ARCADE_TENANT_ID }}
          APOLLO_RUNTIME_NODE2_CHAT_GATEWAY_CONNECTIONS: ${{ secrets.CHAT_GATEWAY_CONNECTIONS }}
          APOLLO_RUNTIME_NODE2_NEBULA_ARCADE_CHANNEL_ID: ${{ secrets.NEBULA_ARCADE_CHANNEL_ID }}
          APOLLO_RUNTIME_NODE2_NEBULA_ARCADE_RUNTIME_CONFIG_JSON: ${{ secrets.NEBULA_ARCADE_RUNTIME_CONFIG_JSON }}
          APOLLO_RUNTIME_NODE2_NEBULA_ARCADE_RUNTIME_CONFIG_PATH: "/tmp/apollo-nebula-runtime.json"
          APOLLO_RUNTIME_NODE2_NEBULA_ARCADE_DATABASE_PATH: "/tmp/apollo-nebula-arcade.sqlite"
          APOLLO_RUNTIME_NODE2_NEBULA_ARCADE_PUBLIC_ORIGIN: "https://apollo-node-2.hostless.app"
          APOLLO_RUNTIME_NODE2_TURSO_AUTH_TOKEN: ${{ secrets.NODE2_TURSO_AUTH_TOKEN }}
          APOLLO_RUNTIME_NODE2_TURSO_DATABASE_URL: ${{ secrets.NODE2_TURSO_DATABASE_URL }}
          APOLLO_NODE_ROLE: node2
        run: node scripts/hostless/ensure-node-app.mjs node2 "${GITHUB_SHA}"
