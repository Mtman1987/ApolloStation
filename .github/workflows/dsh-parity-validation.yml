name: Discord Stream Hub parity validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/discord-stream-hub/**"
      - "scripts/migrate-dsh-raid-pile-to-turso.mjs"
      - "scripts/migrate-dsh-mtfixit-to-turso.mjs"
      - "apps/nebula-arcade/**"
      - "apps/chat-gateway/**"
      - "apps/streamweaver/**"
      - "tests/dsh-*.test.mjs"
      - "tests/nebula-*.test.mjs"
      - "tests/streamweaver-*.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dsh-parity-validation.yml"

permissions:
  contents: read

concurrency:
  group: dsh-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile all apps and packages
        run: npm run build
      - name: Run focused Discord Stream Hub regressions
        run: node --import ./scripts/offline-network-guard.mjs --test tests/dsh-live-monitor.test.mjs tests/dsh-lounge-state.test.mjs tests/dsh-discord-live-publisher.test.mjs tests/dsh-points-parity.test.mjs tests/dsh-production-points-parity.test.mjs
