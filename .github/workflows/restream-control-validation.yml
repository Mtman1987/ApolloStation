name: Restream control service validation

on:
  pull_request:
    paths:
      - "services/restream-control/**"
      - "infra/oracle/restream-control.compose.yml"
      - ".github/workflows/restream-control-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install service dependencies
        working-directory: services/restream-control
        run: npm install --omit=dev --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Run Restream API and safety tests
        working-directory: services/restream-control
        run: npm test
      - name: Build isolated browser controller image
        run: docker build --file services/restream-control/Dockerfile --tag apollo-restream-control:ci .
