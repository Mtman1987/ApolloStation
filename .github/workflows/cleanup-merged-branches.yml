name: Clean merged Apollo branches

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List eligible branches without deleting them"
        type: boolean
        required: true
        default: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: apollo-merged-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete only branches fully contained in main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
          open_prs="$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100")"

          mapfile -t open_branches < <(
            jq -r --arg repo "$GITHUB_REPOSITORY" '
              .[]
              | select(.head.repo.full_name == $repo)
              | .head.ref
            ' <<<"$open_prs"
          )

          merged_pr_heads_file="$(mktemp)"
          page=1
          while :; do
            closed_prs="$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls?state=closed&per_page=100&page=$page")"
            count="$(jq 'length' <<<"$closed_prs")"
            [[ "$count" -eq 0 ]] && break
            jq -r --arg repo "$GITHUB_REPOSITORY" '
              .[]
              | select(.merged_at != null and .base.ref == "main" and .head.repo.full_name == $repo)
              | "\(.head.ref) \(.head.sha)"
            ' <<<"$closed_prs" >> "$merged_pr_heads_file"
            [[ "$count" -lt 100 ]] && break
            page=$((page + 1))
          done

          is_open_pr_branch() {
            local branch="$1" candidate
            for candidate in "${open_branches[@]}"; do
              [[ "$candidate" == "$branch" ]] && return 0
            done
            return 1
          }

          deleted=0
          skipped=0
          while read -r ref sha; do
            branch="${ref#origin/}"
            case "$branch" in
              main|HEAD) continue ;;
            esac

            if is_open_pr_branch "$branch"; then
              echo "KEEP $branch — has an open pull request"
              skipped=$((skipped + 1))
              continue
            fi

            reason=""
            if git merge-base --is-ancestor "$sha" origin/main; then
              reason="branch head is already contained in main"
            elif grep -Fxq "$branch $sha" "$merged_pr_heads_file"; then
              reason="exact head of a pull request merged into main"
            else
              continue
            fi

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "DRY RUN — would delete $branch ($reason)"
            else
              echo "DELETE $branch — $reason"
              git push origin --delete "$branch"
              deleted=$((deleted + 1))
            fi
          done < <(git for-each-ref --format='%(refname:short) %(objectname)' refs/remotes/origin | sort)
          rm -f "$merged_pr_heads_file"

          echo "Cleanup finished. Deleted: $deleted. Kept for open PRs: $skipped. Dry run: $DRY_RUN."
          echo "Branches with unique/unmerged commits are deliberately preserved."
