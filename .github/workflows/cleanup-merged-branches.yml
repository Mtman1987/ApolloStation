name: Archive and clean reviewed Apollo branches

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List eligible branches without deleting them"
        type: boolean
        required: true
        default: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: apollo-merged-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # One-time follow-up cleanup; restore push preview mode immediately after this run.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != false && 'true' || 'false' }}
      ARCHIVE_TAG: apollo-branch-archive-2026-11-22
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inventory, archive, and clean reviewed branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
          MAIN_SHA="$(git rev-parse origin/main)"

          open_branches_file="$(mktemp)"
          merged_pr_heads_file="$(mktemp)"
          pr_metadata_file="$(mktemp)"
          inventory_file="apollo-branch-inventory-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          bundle_file="apollo-branches-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.bundle"

          # Enumerate all open PR pages; every open PR source branch is protected.
          page=1
          while :; do
            open_prs="$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100&page=$page")"
            count="$(jq 'length' <<<"$open_prs")"
            jq -r --arg repo "$GITHUB_REPOSITORY" '
              .[]
              | select(.head.repo != null and .head.repo.full_name == $repo)
              | .head.ref
            ' <<<"$open_prs" >> "$open_branches_file"
            jq -r --arg repo "$GITHUB_REPOSITORY" '
              .[]
              | select(.head.repo != null and .head.repo.full_name == $repo)
              | [.head.ref, ("#" + (.number|tostring)), .state, (.merged_at // "not-merged"),
                 (.title | gsub("[\t\r\n]"; " ")), .head.sha]
              | @tsv
            ' <<<"$open_prs" >> "$pr_metadata_file"
            [[ "$count" -lt 100 ]] && break
            page=$((page + 1))
          done
          mapfile -t open_branches < <(sort -u "$open_branches_file")

          # Only PR heads actually merged into main are automatic candidates.
          # Closed-but-unmerged PR branches stay protected unless explicitly listed below.
          page=1
          while :; do
            closed_prs="$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls?state=closed&per_page=100&page=$page")"
            count="$(jq 'length' <<<"$closed_prs")"
            [[ "$count" -eq 0 ]] && break
            jq -r --arg repo "$GITHUB_REPOSITORY" '
              .[]
              | select(.merged_at != null and .base.ref == "main")
              | select(.head.repo != null and .head.repo.full_name == $repo)
              | "\(.head.ref) \(.head.sha)"
            ' <<<"$closed_prs" >> "$merged_pr_heads_file"
            jq -r --arg repo "$GITHUB_REPOSITORY" '
              .[]
              | select(.head.repo != null and .head.repo.full_name == $repo)
              | [.head.ref, ("#" + (.number|tostring)), .state, (.merged_at // "not-merged"),
                 (.title | gsub("[\t\r\n]"; " ")), .head.sha]
              | @tsv
            ' <<<"$closed_prs" >> "$pr_metadata_file"
            [[ "$count" -lt 100 ]] && break
            page=$((page + 1))
          done

          # Recovery branches explicitly retained in the November 19 owner-reviewed audit.
          protected_branches=(
            "feat/nebula-game-runtime-turso-store"
            "feature/turso-live-runtime-smoke"
            "feat/stellar-kokoro-self-hosted-tts"
            "feat/hmo-xtream-watch-catalog"
            "feat/dsh-mtfixit-intake-turso-followup"
            "port/streamweaver-restream-golive-parity"
            "feat/recovered-json-manifest-verification"
            "feat/oracle-core-runtime-image"
          )

          # Closed, unmerged PR heads individually reviewed as superseded/obsolete.
          # Exact SHA guards prevent deleting a branch that has since received new work.
          declare -A reviewed_closed_heads=(
            ["audit/foundation-donor-final-sweep"]="af435c59e7ef0f62d1c2a6ec56b25bd7fc37b701"
            ["ci/hostless-gated-three-node-deploy"]="3aae284ec10b37fc3e20dc3c00723fa2daf6f7fc"
            ["ci/run-full-validation-before-merge"]="1152f8f4ac22aa8cce5303bb19056a4197f5c42a"
            ["docs/apollo-final-handoff-current-main-2026-11-19"]="11280692482a0599a25385f931933c8b50139561"
            ["docs/apollo-final-handoff-2026-11-19"]="189b7dd9d0cac2991156f8db666b9a2e66b99d6b"
            ["feat/apollo-local-chrome-actions-bridge"]="41bc57478a0af183fd49c50d790e53daa8191a0c"
            ["feat/bulletin-chatgpt-browser-poc"]="1a4ad9a6a19eae9c0406069d3241ba820102e5f9"
            ["feature/manual-spmt-token-handoff"]="2b811a68d92f6d43211d7968b5f250b1003e0121"
            ["fix/direct-oauth-recovery"]="cff3c0bbc9f73dc506f2667542e45950577466e1"
            ["fix/hostless-deploy-cli-progress"]="bfcfb7d9662cd04594cbd76855d02be43c115fba"
            ["fix/nebula-bang-spmt-prefix"]="bc05c590875d2ac77d19f282c4b71bdd15853763"
            ["fix/overlay-bay-home-navigation"]="7ba4bbe03e29347d37995d9f2f19b1b6901ec433"
            ["migration/nebula-network-caller-inventory"]="425f5059fe9649142613105dd068aff18dbe5914"
            ["prototype/apollo-bulletin-open-review"]="a629bd1e5b38ffe6b5b8eb57c3d190829faa048f"
            ["parity/dsh-raid-train-slots"]="959466c50764c2c02f40d9853b6baad209bab0bb"
            ["spmt/hostless-control-plane-foundation"]="4a2fdcb9df3ed202f774f1449530703adc27d91a"
          )

          # No-PR experiments individually reviewed as obsolete/superseded.
          # Unlisted experiments remain protected for manual review.
          declare -A reviewed_no_pr_heads=(
            ["ci/hmo-media-browser-in-shard4"]="f5f6267e51d9bc02221a91320d780b27c64a55a2"
            ["fix/hostless-deploy-api-polling"]="4632bc0e1a951b5d410c7f8d2626769733b2860a"
            ["fix/node3-explicit-free-20261105"]="1f6ba31d5b144280c351500bff9bf42bff133e0a"
            ["hostless-node3-bootstrap"]="3725b73628c9d00fa4930b346e43528d26d2d4be"
            ["node3-bootstrap-free"]="10c36e525d9dfde5bc564e24c18802abf4d90544"
          )

          is_open_pr_branch() {
            local branch="$1" candidate
            for candidate in "${open_branches[@]:-}"; do
              [[ "$candidate" == "$branch" ]] && return 0
            done
            return 1
          }

          is_protected_branch() {
            local branch="$1" candidate
            for candidate in "${protected_branches[@]}"; do
              [[ "$candidate" == "$branch" ]] && return 0
            done
            return 1
          }

          declare -a candidate_branches=()
          declare -a candidate_shas=()
          declare -a candidate_reasons=()
          declare -a inventory_lines=()
          branch_count=0

          while read -r remote_ref sha; do
            [[ -z "$remote_ref" ]] && continue
            branch="${remote_ref#origin/}"
            branch_count=$((branch_count + 1))
            reason=""
            pr_info="$(awk -F '\t' -v b="$branch" '$1 == b { if (out != "") out=out "; "; out=out $2 " " $3 " merged_at=" $4 " title=" $5 } END { print out }' "$pr_metadata_file")"
            ahead="$(git rev-list --count "origin/main..$sha")"
            behind="$(git rev-list --count "$sha..origin/main")"
            last_date="$(git show -s --format=%cI "$sha")"
            last_subject="$(git show -s --format=%s "$sha" | tr '\t\r\n' '   ')"

            case "$branch" in
              main|HEAD)
                inventory_lines+=("KEEP $branch $sha | primary branch/reference")
                continue
                ;;
            esac

            if is_protected_branch "$branch"; then
              inventory_lines+=("KEEP $branch $sha | protected recovery branch | ahead=$ahead behind=$behind | last=$last_date | $last_subject | PR=$pr_info")
              continue
            fi

            if is_open_pr_branch "$branch"; then
              inventory_lines+=("KEEP $branch $sha | open PR branch | ahead=$ahead behind=$behind | last=$last_date | $last_subject | PR=$pr_info")
              continue
            fi

            if git merge-base --is-ancestor "$sha" origin/main; then
              reason="branch head is already contained in main"
            elif grep -Fxq "$branch $sha" "$merged_pr_heads_file"; then
              reason="exact current head of a PR merged into main"
            elif [[ "${reviewed_closed_heads[$branch]:-}" == "$sha" ]]; then
              reason="exact head of a closed PR individually reviewed as superseded"
            elif git diff --quiet origin/main "$sha"; then
              reason="branch tree is identical to main"
            else
              merge_commits="$(git rev-list --merges "origin/main..$sha")"
              if [[ -z "$merge_commits" ]]; then
                cherry_result="$(git cherry -v origin/main "$sha" || true)"
                if [[ -n "$cherry_result" ]] && ! grep -q '^+' <<<"$cherry_result"; then
                  reason="all non-merge commits are patch-equivalent to main"
                fi
              fi
            fi

            if [[ -z "$reason" && "${reviewed_no_pr_heads[$branch]:-}" == "$sha" ]]; then
              reason="exact head of a no-PR experiment individually reviewed as obsolete"
            fi

            if [[ -n "$reason" ]]; then
              candidate_branches+=("$branch")
              candidate_shas+=("$sha")
              candidate_reasons+=("$reason")
              inventory_lines+=("DELETE-CANDIDATE $branch $sha | $reason | ahead=$ahead behind=$behind | last=$last_date | $last_subject | PR=$pr_info")
            else
              inventory_lines+=("KEEP $branch $sha | unique/unmerged and not individually reviewed | ahead=$ahead behind=$behind | last=$last_date | $last_subject | PR=$pr_info")
            fi
          done < <(git for-each-ref --format='%(refname:short) %(objectname)' refs/remotes/origin | sort)

          {
            echo "ApolloStation branch master inventory"
            echo "Captured: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Main SHA: $MAIN_SHA"
            echo "Workflow run: $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            echo "Remote refs inspected: $branch_count"
            echo "Open PR branch count: ${#open_branches[@]}"
            echo "Explicitly protected recovery branch count: ${#protected_branches[@]}"
            echo
            echo "PR metadata (branch, PR, state, merge time, title, exact head SHA):"
            cat "$pr_metadata_file"
            echo
            echo "Branch dispositions (ahead/behind counts, last commit, PR association, exact SHA):"
            printf '%s\n' "${inventory_lines[@]}"
          } > "$inventory_file"

          echo "Inspected $branch_count remote refs."
          echo "Eligible branches: ${#candidate_branches[@]}"
          printf '%s\n' "${inventory_lines[@]}"

          if [[ "${#candidate_branches[@]}" -eq 0 ]]; then
            {
              echo "### Apollo branch cleanup"
              echo "Inspected $branch_count refs. No eligible branches to delete."
            } >> "$GITHUB_STEP_SUMMARY"
            rm -f "$open_branches_file" "$merged_pr_heads_file" "$pr_metadata_file" "$inventory_file"
            exit 0
          fi

          if [[ "$DRY_RUN" == "true" ]]; then
            {
              echo "### Apollo branch cleanup — dry run"
              echo "Inspected $branch_count refs. Eligible: ${#candidate_branches[@]}. No branches were deleted."
              for index in "${!candidate_branches[@]}"; do
                echo "  - ${candidate_branches[$index]} — ${candidate_reasons[$index]}"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Dry run complete. No archive or deletion was performed."
            rm -f "$open_branches_file" "$merged_pr_heads_file" "$pr_metadata_file"
            exit 0
          fi

          # Full-history archive of all fetched refs before any destructive operation.
          git bundle create "$bundle_file" --all
          git bundle verify "$bundle_file"
          bundle_sha="$(sha256sum "$bundle_file" | awk '{print $1}')"
          inventory_sha="$(sha256sum "$inventory_file" | awk '{print $1}')"

          if ! gh release view "$ARCHIVE_TAG" >/dev/null 2>&1; then
            gh release create "$ARCHIVE_TAG" \
              --target "$MAIN_SHA" \
              --title "ApolloStation full-history branch archives" \
              --notes "Verified full-history Git bundles and branch master inventories captured before branch cleanup. Each cleanup run adds a unique bundle and inventory asset."
          fi
          gh release upload "$ARCHIVE_TAG" "$bundle_file" "$inventory_file"

          # Re-download and verify both assets, bundle integrity, and every exact candidate ref.
          verify_dir="$(mktemp -d)"
          gh release download "$ARCHIVE_TAG" --pattern "$bundle_file" --dir "$verify_dir"
          gh release download "$ARCHIVE_TAG" --pattern "$inventory_file" --dir "$verify_dir"
          verified_bundle="$verify_dir/$bundle_file"
          verified_inventory="$verify_dir/$inventory_file"
          [[ "$(sha256sum "$verified_bundle" | awk '{print $1}')" == "$bundle_sha" ]]
          [[ "$(sha256sum "$verified_inventory" | awk '{print $1}')" == "$inventory_sha" ]]
          git bundle verify "$verified_bundle"
          bundle_heads="$(git bundle list-heads "$verified_bundle")"

          for index in "${!candidate_branches[@]}"; do
            branch="${candidate_branches[$index]}"
            sha="${candidate_shas[$index]}"
            if ! grep -Fqx "$sha refs/remotes/origin/$branch" <<<"$bundle_heads" \
              && ! grep -Fqx "$sha refs/heads/$branch" <<<"$bundle_heads"; then
              echo "Archive does not contain exact candidate ref: $branch ($sha)" >&2
              exit 1
            fi
          done

          # Atomic lease-protected deletion: if any ref moved after inventory, none are deleted.
          push_args=(--atomic)
          refspecs=()
          for index in "${!candidate_branches[@]}"; do
            branch="${candidate_branches[$index]}"
            sha="${candidate_shas[$index]}"
            push_args+=("--force-with-lease=refs/heads/$branch:$sha")
            refspecs+=(":refs/heads/$branch")
          done
          git push "${push_args[@]}" origin "${refspecs[@]}"

          for branch in "${candidate_branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Branch still exists after cleanup: $branch" >&2
              exit 1
            fi
          done

          {
            echo "### Apollo branch cleanup"
            echo "Inspected $branch_count refs."
            echo "Deleted ${#candidate_branches[@]} reviewed branches after verifying the full-history archive."
            echo "Archive release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$ARCHIVE_TAG"
            echo "Bundle: $bundle_file (SHA-256: $bundle_sha)"
            echo "Inventory: $inventory_file (SHA-256: $inventory_sha)"
            echo "Protected recovery branches and all open PR branches were preserved."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Verified archive and cleanup complete. Deleted ${#candidate_branches[@]} branches."
          rm -rf "$verify_dir"
          rm -f "$open_branches_file" "$merged_pr_heads_file" "$pr_metadata_file"
