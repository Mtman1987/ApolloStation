name: StreamWeaver parity validation

on:
  workflow_dispatch:
  push:
    branches:
      - feat/streamweaver-avatar-gesture-replies
    paths:
      - apps/streamweaver/src/chat-gateway-consumer.ts
      - apps/streamweaver/src/overlay-widgets.ts
      - apps/streamweaver/src/community-runtime.ts
      - apps/nebula-arcade/src/provider-runtime.ts
      - tests/streamweaver-chat-gateway.test.mjs
      - tests/streamweaver-overlay-widgets.test.mjs
      - .github/workflows/streamweaver-parity-validation.yml
  pull_request:
    paths:
      - apps/streamweaver/src/chat-gateway-consumer.ts
      - apps/streamweaver/src/overlay-widgets.ts
      - apps/streamweaver/src/community-runtime.ts
      - apps/nebula-arcade/src/provider-runtime.ts
      - tests/streamweaver-chat-gateway.test.mjs
      - tests/streamweaver-overlay-widgets.test.mjs
      - .github/workflows/streamweaver-parity-validation.yml

permissions:
  contents: read

concurrency:
  group: streamweaver-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile all apps and packages
        run: npm run build
      - name: Run focused pull-request regressions
        if: github.event_name == 'pull_request'
        run: node --import ./scripts/offline-network-guard.mjs --test tests/streamweaver-rides.test.mjs tests/streamweaver-chat-gateway.test.mjs tests/streamweaver-overlay-widgets.test.mjs
      - name: Run full manual StreamWeaver regressions
        if: github.event_name == 'workflow_dispatch'
        run: node --import ./scripts/offline-network-guard.mjs --test tests/streamweaver-tts-text.test.mjs tests/streamweaver-shoutout-runtime.test.mjs tests/streamweaver-provider-runtime.test.mjs tests/streamweaver-eventsub-lifecycle.test.mjs tests/streamweaver-rides.test.mjs tests/streamweaver-stella-lounge-host.test.mjs tests/streamweaver-chat-gateway.test.mjs tests/streamweaver-overlay-widgets.test.mjs
