name: ApolloStation pull-request validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/spacemountain-web/**"
      - "apps/nebula-arcade/**"
      - "apps/streamweaver/**"
      - "apps/chat-gateway/**"
      - "apps/discord-stream-hub/**"
      - "tests/*.test.mjs"
      - "docs/deployment/**"
      - "tests/spacemountain-overlay-proxy.test.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/pull-request-validation.yml"

permissions:
  contents: read

concurrency:
  group: apollo-pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Inventory SQLite persistence usage
        run: npm run persistence:audit -- --json > /tmp/apollo-sqlite-audit.json && node -e "const r=require('/tmp/apollo-sqlite-audit.json'); console.log(JSON.stringify(r.totals, null, 2))"
      - name: Install local media test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Build and run offline-network regression suite
        run: npm run test:offline
