name: ApolloStation pull-request validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apollo-pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install local media test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Build workspace
        run: npm run build
      - name: Run full offline-network regression suite
        run: npm run test:offline
      - name: Run MtFixIt policy regression tests (offline-safe)
        run: node --import ./scripts/offline-network-guard.mjs --test tests/mtfixit-policy.test.mjs
