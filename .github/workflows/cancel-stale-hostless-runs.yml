name: Cancel stale Apollo Hostless release attempts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cancel-stale-hostless-runs.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    name: Keep only the current validated release
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded two-node release runs
        uses: actions/github-script@v7
        with:
          script: |
            const keepSha = 'cdc148e9c6378ff629dfb0258f2c64c0bf0863ea';
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'hostless-three-node-deploy.yml',
              per_page: 100
            });
            const stale = data.workflow_runs.filter(run =>
              run.head_sha !== keepSha &&
              ['queued', 'in_progress'].includes(run.status)
            );
            for (const run of stale) {
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                core.notice('Cancelled superseded Hostless release run ' + run.id + ' at ' + run.head_sha);
              } catch (error) {
                if (error.status === 409 || String(error.message).includes('not in progress')) {
                  core.notice('Run ' + run.id + ' finished before cancellation; leaving its final state unchanged.');
                  continue;
                }
                throw error;
              }
            }
            core.notice('Preserved validated release commit ' + keepSha + '; cancelled ' + stale.length + ' older or superseded run(s).');
