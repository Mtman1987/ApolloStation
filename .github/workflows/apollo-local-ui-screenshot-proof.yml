name: Apollo local UI screenshot proof

on:
  push:
    branches: [proof/local-ui-screenshot-artifact]
    paths:
      - "scripts/hostless/capture-ui-preview.mjs"
      - ".github/workflows/apollo-local-ui-screenshot-proof.yml"
      - "apps/spacemountain-web/**"
      - "apps/spacemountain/**"
      - "packages/**"
      - "apps/spmt-service/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Build isolated preview and capture UI screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build local SpaceMountain preview
        run: npm run build:hostless
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Capture preview screenshots
        run: node scripts/hostless/capture-ui-preview.mjs
      - name: Upload screenshot proof
        uses: actions/upload-artifact@v4
        with:
          name: apollo-local-ui-screenshot-proof
          path: artifacts/ui-preview/*.png
          if-no-files-found: error
          retention-days: 7
