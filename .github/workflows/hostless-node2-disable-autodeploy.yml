name: Disable Hostless automatic Node 2 deployments

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hostless-node2-disable-autodeploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apollo-hostless-release
  cancel-in-progress: true

jobs:
  disable-auto-deploy:
    name: Make Apollo Actions the sole Node 2 deploy controller; cancel stale full release runs
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Disable automatic Git push deployments for Node 1 without redeploying it
        env:
          HOSTLESS_TOKEN: ${{ secrets.HOSTLESS_NODE1_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.hostless.cloud/v1/apps/apollo-node-1"
          curl -fsS -X PATCH "$API" \
            -H "Authorization: $HOSTLESS_TOKEN" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data '{"autoDeployOnPush":false}' \
            -o /tmp/hostless-node1-update.json
          curl -fsS "$API" \
            -H "Authorization: $HOSTLESS_TOKEN" \
            -H "Accept: application/json" \
            -o /tmp/hostless-node1-app.json
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const d = JSON.parse(fs.readFileSync("/tmp/hostless-node1-app.json", "utf8"));
          const a = d.app ?? d;
          if (a.autoDeployOnPush !== false || a.status !== "RUNNING") {
            console.error("Node 1 auto-deploy disable or running-state verification failed.");
            console.error(JSON.stringify({ status: a.status, autoDeployOnPush: a.autoDeployOnPush }));
            process.exit(1);
          }
          console.log("Verified: Node 1 remains RUNNING and autoDeployOnPush=false; no redeploy requested.");
          NODE

      - name: Disable automatic Git push deployments for Node 2
        env:
          HOSTLESS_TOKEN: ${{ secrets.HOSTLESS_NODE2_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.hostless.cloud/v1/apps/apollo-node-2"
          curl -fsS -X PATCH "$API" \
            -H "Authorization: $HOSTLESS_TOKEN" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data '{"autoDeployOnPush":false,"webProcess":{"command":"node scripts/hostless/start-node.mjs","minCpu":0.01,"maxCpu":0.1,"minMemory":128,"maxMemory":256,"minReplicas":1,"maxReplicas":1}}' \
            -o /tmp/hostless-update.json
          curl -fsS "$API" \
            -H "Authorization: $HOSTLESS_TOKEN" \
            -H "Accept: application/json" \
            -o /tmp/hostless-app.json
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const update = JSON.parse(fs.readFileSync("/tmp/hostless-update.json", "utf8"));
          const detail = JSON.parse(fs.readFileSync("/tmp/hostless-app.json", "utf8"));
          const app = detail.app ?? detail;
          if (app.autoDeployOnPush !== false || app.webProcess?.command !== "node scripts/hostless/start-node.mjs") {
            console.error("Hostless did not confirm autoDeployOnPush=false.");
            console.error(JSON.stringify({ updateStatus: update.status, autoDeployOnPush: app.autoDeployOnPush, startCommand: app.webProcess?.command }));
            process.exit(1);
          }
          console.log("Verified: Node 2 uses node scripts/hostless/start-node.mjs and autoDeployOnPush=false. GitHub Actions now controls Node 2 deployments.");
          NODE
