name: Reference context linking once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reference-context-linking-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Link each audit event before resolving references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('apps/spacemountain/src/index.ts')
          text=p.read_text(encoding='utf-8')
          old='for(const log of logs){refs.push(...discoverHumanReferencesInText(log.summary));if(log.detail)refs.push(...discoverHumanReferencesInText(log.detail));}'
          new='for(const log of logs){refs.push(...discoverHumanReferencesInText(`${log.summary}\\n${log.detail??""}`));}'
          if old not in text: raise SystemExit('SpaceMountain log reference collector missing')
          p.write_text(text.replace(old,new,1),encoding='utf-8')

          p=Path('packages/app-foundation/src/product-web.ts')
          text=p.read_text(encoding='utf-8')
          old='if (typeof record.summary === "string") refs.push(...discoverHumanReferencesInText(record.summary));\n    if (typeof record.detail === "string") refs.push(...discoverHumanReferencesInText(record.detail));'
          new='const summary = typeof record.summary === "string" ? record.summary : "";\n    const detail = typeof record.detail === "string" ? record.detail : "";\n    refs.push(...discoverHumanReferencesInText(`${summary}\\n${detail}`));'
          if old not in text: raise SystemExit('Shared product log reference collector missing')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Validate ecosystem
        run: npm test
      - name: Commit contextual collectors
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/spacemountain/src/index.ts packages/app-foundation/src/product-web.ts
          git commit -m "Resolve audit references with event context"
          git push origin HEAD:main
