name: Hostless runtime log diagnostics
# Check current Node 2 release after disabling automatic Git deployments.
# Also capture the Node 2-only launcher port/bind retry and app-level start command; check whether the new command passes readiness.

on:
  schedule:
    - cron: '17 */6 * * *' # Every six hours, offset from common cron boundaries
  push:
    branches: [main, fix/apollo-bulletin-readiness-distributed-lease]
    paths:
      - ".github/workflows/hostless-runtime-log-diagnostics.yml"
      - ".github/workflows/hostless-three-node-deploy.yml"
      - ".github/workflows/hostless-node2-retry.yml"
      - ".github/workflows/hostless-node2-fast-deploy.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Which Apollo Hostless node to inspect
        required: true
        type: choice
        options:
          - both
          - node1
          - node2
        default: both
      since:
        description: Recent log window (for example 30m or 2h)
        required: true
        type: string
        default: 2h
      deployment_id:
        description: Optional exact Hostless deployment ID (leave blank for recent runtime errors)
        required: false
        type: string
  workflow_run:
    workflows: ["ApolloStation Hostless two-node release", "ApolloStation Hostless Node 2 retry", "ApolloStation Hostless Node 2 fast deploy"]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  collect:
    name: Collect ${{ matrix.label }} logs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: node1
            label: Node 1
            app: apollo-node-1
            hostless_secret: HOSTLESS_NODE1_TOKEN
          - node: node2
            label: Node 2
            app: apollo-node-2
            hostless_secret: HOSTLESS_NODE2_TOKEN
    steps:
      - name: Check out diagnostic sanitizer
        uses: actions/checkout@v4

      - name: Resolve exact Node 2 deployment from the triggering run
        id: deployment
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          JOBS="$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100")"
          JOB_ID="$(printf '%s' "$JOBS" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s).jobs||[];const x=j.find(v=>v.name.startsWith("Deploy Node 2"));if(x)process.stdout.write(String(x.id));})')"
          if [ -z "$JOB_ID" ]; then echo "No Node 2 deployment job exists in source run."; exit 0; fi
          LOG="$(gh run view "$SOURCE_RUN_ID" --job "$JOB_ID" --repo "$REPOSITORY" --log 2>/dev/null || true)"
          DEPLOYMENT_ID="$(printf '%s\\n' "$LOG" | grep -Eo 'Deployment [a-f0-9]{24}:' | tail -n1 | awk '{print $2}' | tr -d ':' || true)"
          if [ -n "$DEPLOYMENT_ID" ]; then echo "id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"; echo "Resolved exact Node 2 deployment: $DEPLOYMENT_ID"; else echo "Could not extract a deployment ID from the Node 2 job log."; fi

      - name: Install Hostless CLI
        run: |
          curl -fsSL https://hostless.cloud/install.sh | bash
          hostless --version

      - name: Collect runtime and deployment logs
        if: always()
        env:
          HOSTLESS_TOKEN: ${{ secrets[matrix.hostless_secret] }}
          APP: ${{ matrix.app }}
          NODE: ${{ matrix.node }}
          TARGET: ${{ inputs.target }}
          EVENT_NAME: ${{ github.event_name }}
          SINCE: ${{ inputs.since || '2h' }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id || steps.deployment.outputs.id || '' }}
        run: |
          set +e
          mkdir -p hostless-diagnostics
          WINDOW="${SINCE:-2h}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$TARGET" ] && [ "$TARGET" != "both" ] && [ "$TARGET" != "$NODE" ]; then
            echo "Skipping $NODE because target is $TARGET."
            exit 0
          fi
          API="https://api.hostless.cloud/v1/apps/$APP"
          # Hostless metrics endpoints require numeric-string start/end (epoch
          # milliseconds) and step (seconds) query parameters, matching the
          # dashboard's own calls; without them the API returns HTTP 400
          # "Validation failed (numeric string is expected)".
          METRICS_END_MS=$(( $(date +%s) * 1000 ))
          WINDOW_SECONDS=7200
          if [[ "$WINDOW" =~ ^([0-9]+)([mh])$ ]]; then
            if [ "${BASH_REMATCH[2]}" = "h" ]; then WINDOW_SECONDS=$(( BASH_REMATCH[1] * 3600 )); else WINDOW_SECONDS=$(( BASH_REMATCH[1] * 60 )); fi
          fi
          METRICS_START_MS=$(( METRICS_END_MS - WINDOW_SECONDS * 1000 ))
          METRICS_STEP=300
          if [ $(( WINDOW_SECONDS / METRICS_STEP )) -gt 500 ]; then METRICS_STEP=$(( (WINDOW_SECONDS + 499) / 500 )); fi
          METRICS_QUERY="start=${METRICS_START_MS}&end=${METRICS_END_MS}&step=${METRICS_STEP}"
          curl -sS --max-time 20 -H "Authorization: $HOSTLESS_TOKEN" -H "Accept: application/json" "$API" -o hostless-diagnostics/app-detail.json
          curl -sS --max-time 20 -H "Authorization: $HOSTLESS_TOKEN" -H "Accept: application/json" "$API/deployments" -o hostless-diagnostics/deployments.json
          curl -sS --max-time 20 -H "Authorization: $HOSTLESS_TOKEN" -H "Accept: application/json" "$API/metrics/cpu-usage?$METRICS_QUERY" -o hostless-diagnostics/cpu-usage.json
          curl -sS --max-time 20 -H "Authorization: $HOSTLESS_TOKEN" -H "Accept: application/json" "$API/metrics/memory-usage?$METRICS_QUERY" -o hostless-diagnostics/memory-usage.json
          APP_URL="$(node --input-type=module -e 'import fs from "node:fs"; const d=JSON.parse(fs.readFileSync("hostless-diagnostics/app-detail.json","utf8")); const a=d.app??d; process.stdout.write(String(a.url??a.appUrl??a.publicUrl??""));')"
          if [ -n "$APP_URL" ]; then
            if curl -fsS --max-time 20 "$APP_URL/health/ready" -o hostless-diagnostics/health-ready.json; then
              echo "HTTP readiness passed for $APP: $APP_URL/health/ready"
            else
              echo "HTTP readiness did not pass for $APP: $APP_URL/health/ready (curl exit $?)"
            fi
            curl -sS --max-time 20 "$APP_URL/bulletin/health/ready" -o hostless-diagnostics/bulletin-health-ready.json || true
          else
            echo "No public app URL was returned for $APP; HTTP readiness was not tested."
          fi

          # Capture a bounded HTTP behavior matrix. Record status/timing separately
          # from bodies so 4xx/5xx responses remain useful evidence rather than vanishing.
          : > hostless-diagnostics/http-probes.txt
          if [ -n "$APP_URL" ]; then
            for route in / /health/live /health/ready /bulletin/health/ready /bulletin/api/tasks /bulletin/browser /bulletin/api/browser/status /login /api/health /v1/session /v1/auth/session/check; do
              safe_name="$(printf '%s' "$route" | tr '/-' '__')"
              code="$(curl -sS --max-time 20 -o "hostless-diagnostics/http-${safe_name}.body" -w '%{http_code}' "$APP_URL$route" 2>"hostless-diagnostics/http-${safe_name}.stderr" || true)"
              timing="$(curl -sS --max-time 20 -o /dev/null -w 'total=%{time_total}s connect=%{time_connect}s ttfb=%{time_starttransfer}s bytes=%{size_download}' "$APP_URL$route" 2>/dev/null || true)"
              printf '%-18s status=%s %s\\n' "$route" "${code:-000}" "$timing" | tee -a hostless-diagnostics/http-probes.txt
            done
            CRON_CODE="$(curl -sS --max-time 20 -X POST -o hostless-diagnostics/http-bulletin-cron-post.body -w '%{http_code}' "$APP_URL/bulletin/api/cron/tick" 2>/dev/null || true)"
            printf '%-34s status=%s (unauthenticated POST; expected 401)\n' "/bulletin/api/cron/tick" "${CRON_CODE:-000}" | tee -a hostless-diagnostics/http-probes.txt
            REVIEW_CODE="$(curl -sS --max-time 20 -o hostless-diagnostics/http-bulletin-review.body -w '%{http_code}' "$APP_URL/bulletin/review/123e4567-e89b-42d3-a456-426614174000" 2>/dev/null || true)"
            printf '%-34s status=%s (unknown capability; expected 404)\n' "/bulletin/review/<synthetic-uuid>" "${REVIEW_CODE:-000}" | tee -a hostless-diagnostics/http-probes.txt
          else
            echo "HTTP probes skipped: no public URL." | tee -a hostless-diagnostics/http-probes.txt
          fi

          # Verify the owner-facing recovery surface on Node 1 without completing OAuth
          # or attempting a password change. Only status, provider host, callback host,
          # and cookie names are retained; OAuth state and cookie values are discarded.
          if [ "$NODE" = "node1" ] && [ -n "$APP_URL" ]; then
            ROOT_BODY="hostless-diagnostics/http-_.body"
            if [ -f "$ROOT_BODY" ] && grep -q "apollo-recovery-start" "$ROOT_BODY" && grep -q "apollo-recovery-password" "$ROOT_BODY"; then
              echo "Apollo recovery UI markup: present" | tee -a hostless-diagnostics/http-probes.txt
            else
              echo "Apollo recovery UI markup: missing" | tee -a hostless-diagnostics/http-probes.txt
            fi
            for provider in discord twitch; do
              HEADERS="$(mktemp)"
              STATUS="$(curl -sS --max-time 20 -D "$HEADERS" -o /dev/null -w '%{http_code}' "$APP_URL/v1/auth/linked-provider-recovery/start?provider=$provider&username=apollo-probe-user" 2>/dev/null || true)"
              node --input-type=module - "$provider" "$STATUS" "$HEADERS" <<'NODE'
          import fs from "node:fs";
          const [provider, status, file] = process.argv.slice(2);
          const lines = fs.readFileSync(file, "utf8").split(/\r?\n/);
          const locationLine = lines.find(line => /^location:/i.test(line));
          const location = locationLine ? locationLine.slice(locationLine.indexOf(":") + 1).trim() : "";
          const cookies = lines.filter(line => /^set-cookie:/i.test(line)).map(line => line.slice(line.indexOf(":") + 1).trim().split("=", 1)[0]).filter(Boolean);
          let oauthHost = "none";
          let callbackHost = "none";
          try {
            const target = new URL(location);
            oauthHost = target.host;
            const callback = target.searchParams.get("redirect_uri");
            if (callback) callbackHost = new URL(callback).host;
          } catch {}
          console.log(`${provider} recovery start status=${status} oauthHost=${oauthHost} callbackHost=${callbackHost} cookieNames=${cookies.join(",") || "none"}`);
          NODE
              rm -f "$HEADERS"
            done
            BODY="$(mktemp)"
            STATUS="$(curl -sS --max-time 20 -o "$BODY" -w '%{http_code}' -X POST "$APP_URL/v1/auth/linked-provider-recovery/password" 2>/dev/null || true)"
            ERROR_CODE="$(node --input-type=module - "$BODY" <<'NODE'
          import fs from "node:fs";
          try { process.stdout.write(String(JSON.parse(fs.readFileSync(process.argv[2], "utf8")).error ?? "none")); }
          catch { process.stdout.write("unparseable"); }
          NODE
            )"
            echo "Recovery password endpoint without ticket status=$STATUS error=$ERROR_CODE" | tee -a hostless-diagnostics/http-probes.txt
            rm -f "$BODY"
          fi

          # Capture informational and warning logs as well as errors. Keep the
          # complete output in the Actions artifact; the issue publisher bounds excerpts.
          hostless logs --app "$APP" --since "$WINDOW" --level warn > hostless-diagnostics/recent-warnings.log 2>&1
          WARN_STATUS=$?
          echo "Warning log command exit code: $WARN_STATUS" >> hostless-diagnostics/summary.txt

          hostless logs --app "$APP" --since "$WINDOW" --level info > hostless-diagnostics/recent-info.log 2>&1

          INFO_STATUS=$?

          echo "Info log command exit code: $INFO_STATUS" >> hostless-diagnostics/summary.txt

          # Preserve names only, plus the origin of this explicitly non-secret URL setting.
          # All other environment values are discarded without being logged or uploaded.
          curl -sS --max-time 20 -H "Authorization: $HOSTLESS_TOKEN" -H "Accept: application/json" "$API/environment-variables" -o hostless-diagnostics/environment-variable-names.json
          node --input-type=module -e 'import fs from "node:fs"; const p="hostless-diagnostics/environment-variable-names.json"; try { const d=JSON.parse(fs.readFileSync(p,"utf8")); const a=Array.isArray(d)?d:(d.variables??d.environmentVariables??d.items??d.data??[]); const names=a.map(x=>x.name??x.key).filter(x=>typeof x==="string").sort(); const item=a.find(x=>(x.name??x.key)==="SPMT_ORIGIN"); const raw=typeof item?.value==="string"?item.value:typeof item?.currentValue==="string"?item.currentValue:""; let origin=null; try { if(raw) origin=new URL(raw).origin; } catch {} fs.writeFileSync(p,JSON.stringify(names,null,2)); fs.writeFileSync("hostless-diagnostics/environment-safe-config.json",JSON.stringify({SPMT_ORIGIN:{configured:names.includes("SPMT_ORIGIN"),origin}},null,2)); } catch { fs.writeFileSync(p,"[unparseable response; raw body intentionally discarded]"); fs.writeFileSync("hostless-diagnostics/environment-safe-config.json",JSON.stringify({SPMT_ORIGIN:{configured:false,origin:null}})); }'
          {
            echo "App: $APP"
            echo "Window: $WINDOW"
            echo "Timestamp (UTC): $(date -u +%FT%TZ)"
            echo "Git commit: ${GITHUB_SHA}"
            echo "Workflow run: ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            echo "Runner Node: $(node --version)"
            echo "Hostless CLI: $(hostless --version 2>&1 | head -n 1)"
            echo
            echo "===== HOSTLESS APP STATE ====="
            node --input-type=module -e 'import fs from "node:fs"; const d=JSON.parse(fs.readFileSync("hostless-diagnostics/app-detail.json","utf8")); const a=d.app??d; const pick=(o,keys)=>Object.fromEntries(keys.filter(k=>o?.[k]!==undefined).map(k=>[k,o[k]])); console.log(JSON.stringify({...pick(a,["id","name","status","state","appState","url","appUrl","publicUrl","defaultDomain","domains","containerPort"]),...pick(d,["status","state"])},null,2));'
            echo
            echo "===== RESOURCE METRICS ====="
            echo "metrics query: $METRICS_QUERY"
            for metric in cpu-usage memory-usage; do echo "$metric:"; head -c 4000 "hostless-diagnostics/$metric.json"; echo; done
            echo
            echo "===== RECENT DEPLOYMENTS ====="
            node --input-type=module -e 'import fs from "node:fs"; const d=JSON.parse(fs.readFileSync("hostless-diagnostics/deployments.json","utf8")); const rows=Array.isArray(d)?d:(d.items??d.deployments??d.data??[]); console.log(JSON.stringify(rows.slice(0,8).map(x=>({id:x.id??x._id,status:x.status,trigger:x.trigger,commit:x.commitSha??x.commit??x.gitCommit,createdAt:x.createdAt??x.created_at})),null,2));'
            echo
            echo "===== RECENT ERROR LOGS ====="
          } | tee hostless-diagnostics/summary.txt

          hostless logs --app "$APP" --since "$WINDOW" --level error > hostless-diagnostics/recent-errors.log 2>&1
          RECENT_STATUS=$?
          echo "Recent log command exit code: $RECENT_STATUS" | tee -a hostless-diagnostics/summary.txt

          if [ -z "$DEPLOYMENT_ID" ]; then
            DEPLOYMENT_ID="$(node --input-type=module -e 'import fs from "node:fs"; const d=JSON.parse(fs.readFileSync("hostless-diagnostics/app-detail.json","utf8")); const a=d.app??d; process.stdout.write(String(a.activeDeployment??""));')"
            if [ -n "$DEPLOYMENT_ID" ]; then
              echo "Resolved the app's active Hostless deployment: $DEPLOYMENT_ID"
            else
              DEPLOYMENT_ID="$(node --input-type=module -e 'import fs from "node:fs"; const d=JSON.parse(fs.readFileSync("hostless-diagnostics/deployments.json","utf8")); const rows=Array.isArray(d)?d:(d.items??d.deployments??d.data??[]); const x=rows[0]; process.stdout.write(String(x?.id??x?._id??""));')"
              if [ -n "$DEPLOYMENT_ID" ]; then echo "Resolved latest Hostless deployment from the app deployment list: $DEPLOYMENT_ID"; fi
            fi
          fi
          if [ -n "$DEPLOYMENT_ID" ]; then
            echo "===== DEPLOYMENT LOGS: $DEPLOYMENT_ID =====" | tee -a hostless-diagnostics/summary.txt
            hostless logs --app "$APP" --deployment "$DEPLOYMENT_ID" > hostless-diagnostics/deployment.log 2>&1
            DEPLOYMENT_LOG_STATUS=$?
            echo "Deployment log command exit code: $DEPLOYMENT_LOG_STATUS" | tee -a hostless-diagnostics/summary.txt
            API="https://api.hostless.cloud/v1/apps/$APP/deployments/$DEPLOYMENT_ID"
            curl -sS --max-time 20 -H "Authorization: $HOSTLESS_TOKEN" -H "Accept: application/json" "$API" -o hostless-diagnostics/deployment-detail.json
            curl -sS --max-time 20 -H "Authorization: $HOSTLESS_TOKEN" -H "Accept: application/json" "$API/logs" -o hostless-diagnostics/deployment-api-logs.json
            curl -sS --max-time 20 -H "Authorization: $HOSTLESS_TOKEN" -H "Accept: application/json" "$API/post-build-logs" -o hostless-diagnostics/post-build-logs.json
            echo "Fetched Hostless deployment detail, release logs, and post-build logs through the API." | tee -a hostless-diagnostics/summary.txt
          fi
          exit 0

      - name: Sanitize diagnostic files before any publication
        id: sanitize
        if: always()
        run: |
          set -euo pipefail
          if [ -d hostless-diagnostics ]; then
            node scripts/sanitize-diagnostics.mjs hostless-diagnostics
          else
            echo "No diagnostic directory was created."
          fi

      - name: Publish sanitized agent-readable summary
        if: ${{ always() && steps.sanitize.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NODE: ${{ matrix.node }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          node = os.environ["NODE"]
          run_id = os.environ["RUN_ID"]
          files = [pathlib.Path('hostless-diagnostics/summary.txt'), pathlib.Path('hostless-diagnostics/app-detail.json'), pathlib.Path('hostless-diagnostics/deployments.json'), pathlib.Path('hostless-diagnostics/cpu-usage.json'), pathlib.Path('hostless-diagnostics/memory-usage.json'), pathlib.Path('hostless-diagnostics/health-ready.json'), pathlib.Path('hostless-diagnostics/bulletin-health-ready.json'), pathlib.Path('hostless-diagnostics/http-probes.txt'), pathlib.Path('hostless-diagnostics/recent-errors.log'), pathlib.Path('hostless-diagnostics/recent-warnings.log'), pathlib.Path('hostless-diagnostics/recent-info.log'), pathlib.Path('hostless-diagnostics/environment-variable-names.json'), pathlib.Path('hostless-diagnostics/environment-safe-config.json'), pathlib.Path('hostless-diagnostics/deployment.log'), pathlib.Path('hostless-diagnostics/deployment-api-logs.json'), pathlib.Path('hostless-diagnostics/post-build-logs.json'), pathlib.Path('hostless-diagnostics/deployment-detail.json')]
          files.extend(sorted(pathlib.Path('hostless-diagnostics').glob('http-*.body')))
          def redact(s):
            patterns = [(r'(?i)(authorization\s*[:=]\s*bearer\s+)\S+', r'\1[REDACTED]'), (r'(?i)(bearer\s+)\S+', r'\1[REDACTED]'), (r'(?i)(cookie|set-cookie)\s*[:=]\s*[^\r\n]+', r'\1: [REDACTED]'), (r'(?i)(["\']?(?:token|secret|password|passwd|api[_-]?key|session[_-]?key)["\']?\s*[:=]\s*["\']?)[^\s,;"\']+', r'\1[REDACTED]'), (r'(?i)(sk-[a-z0-9_-]{12,}|gh[pousr]_[a-z0-9]{20,}|github_pat_[a-z0-9_]{20,})', '[REDACTED]'), (r'(?i)(eyJ[a-z0-9_-]{10,}\.)[a-z0-9_-]{10,}(?:\.[a-z0-9_-]{10,})?', '[REDACTED-JWT]')]
            for p, repl in patterns: s = re.sub(p, repl, s)
            return s
          out = ['## '+node+' diagnostics — run '+run_id, '']
          budget = 48000
          for f in files:
            if not f.exists() or budget <= 0: continue
            content = redact(f.read_text(errors='replace'))
            excerpt = content[:min(6000, budget)]
            out += ['### '+f.name, '```text', excerpt, '```', '']
            budget -= len(excerpt)
          out += ['[Issue comment excerpts are bounded; the complete sanitized collection is in the workflow artifact.]']
          pathlib.Path('agent-summary.md').write_text('\n'.join(out))
          PY
          gh issue comment 517 --repo "$REPOSITORY" --body-file agent-summary.md

      - name: Upload diagnostic logs
        if: ${{ always() && steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: hostless-${{ matrix.node }}-diagnostics-${{ github.run_id }}
          path: hostless-diagnostics/
          if-no-files-found: warn
          retention-days: 7
