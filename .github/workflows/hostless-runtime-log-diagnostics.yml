name: Hostless runtime log diagnostics
# Check current Node 2 release after disabling automatic Git deployments.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hostless-runtime-log-diagnostics.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Which Apollo Hostless node to inspect
        required: true
        type: choice
        options:
          - both
          - node1
          - node2
        default: both
      since:
        description: Recent log window (for example 30m or 2h)
        required: true
        type: string
        default: 2h
      deployment_id:
        description: Optional exact Hostless deployment ID (leave blank for recent runtime errors)
        required: false
        type: string
  workflow_run:
    workflows: ["ApolloStation Hostless two-node release", "ApolloStation Hostless Node 2 retry", "ApolloStation Hostless Node 2 fast deploy"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  collect:
    name: Collect ${{ matrix.label }} logs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: node1
            label: Node 1
            app: apollo-node-1
            hostless_secret: HOSTLESS_NODE1_TOKEN
          - node: node2
            label: Node 2
            app: apollo-node-2
            hostless_secret: HOSTLESS_NODE2_TOKEN
    steps:
      - name: Resolve exact Node 2 deployment from the triggering run
        id: deployment
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          JOBS="$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100")"
          JOB_ID="$(printf '%s' "$JOBS" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s).jobs||[];const x=j.find(v=>v.name.startsWith("Deploy Node 2"));if(x)process.stdout.write(String(x.id));})')"
          if [ -z "$JOB_ID" ]; then echo "No Node 2 deployment job exists in source run."; exit 0; fi
          LOG="$(gh run view "$SOURCE_RUN_ID" --job "$JOB_ID" --repo "$REPOSITORY" --log 2>/dev/null || true)"
          DEPLOYMENT_ID="$(printf '%s\\n' "$LOG" | grep -Eo 'Deployment [a-f0-9]{24}:' | tail -n1 | awk '{print $2}' | tr -d ':' || true)"
          if [ -n "$DEPLOYMENT_ID" ]; then echo "id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"; echo "Resolved exact Node 2 deployment: $DEPLOYMENT_ID"; else echo "Could not extract a deployment ID from the Node 2 job log."; fi

      - name: Install Hostless CLI
        run: |
          curl -fsSL https://hostless.cloud/install.sh | bash
          hostless --version

      - name: Collect runtime and deployment logs
        env:
          HOSTLESS_TOKEN: ${{ secrets[matrix.hostless_secret] }}
          APP: ${{ matrix.app }}
          NODE: ${{ matrix.node }}
          TARGET: ${{ inputs.target }}
          EVENT_NAME: ${{ github.event_name }}
          SINCE: ${{ inputs.since || '2h' }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id || steps.deployment.outputs.id || '' }}
        run: |
          set +e
          mkdir -p hostless-diagnostics
          WINDOW="${SINCE:-2h}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$TARGET" ] && [ "$TARGET" != "both" ] && [ "$TARGET" != "$NODE" ]; then
            echo "Skipping $NODE because target is $TARGET."
            exit 0
          fi
          API="https://api.hostless.cloud/v1/apps/$APP"
          curl -sS -H "Authorization: $HOSTLESS_TOKEN" -H "Accept: application/json" "$API" -o hostless-diagnostics/app-detail.json
          curl -sS -H "Authorization: $HOSTLESS_TOKEN" -H "Accept: application/json" "$API/deployments" -o hostless-diagnostics/deployments.json
          {
            echo "App: $APP"
            echo "Window: $WINDOW"
            echo "Timestamp (UTC): $(date -u +%FT%TZ)"
            echo
            echo "===== HOSTLESS APP STATE ====="
            node --input-type=module -e 'import fs from "node:fs"; const d=JSON.parse(fs.readFileSync("hostless-diagnostics/app-detail.json","utf8")); const a=d.app??d; const pick=(o,keys)=>Object.fromEntries(keys.filter(k=>o?.[k]!==undefined).map(k=>[k,o[k]])); console.log(JSON.stringify({...pick(a,["id","name","status","state","appState","url","appUrl","publicUrl","defaultDomain","domains","containerPort"]),...pick(d,["status","state"])},null,2));'
            echo
            echo "===== RECENT DEPLOYMENTS ====="
            node --input-type=module -e 'import fs from "node:fs"; const d=JSON.parse(fs.readFileSync("hostless-diagnostics/deployments.json","utf8")); const rows=Array.isArray(d)?d:(d.deployments??d.data??[]); console.log(JSON.stringify(rows.slice(0,8).map(x=>({id:x.id??x._id,status:x.status,trigger:x.trigger,commit:x.commitSha??x.commit??x.gitCommit,createdAt:x.createdAt??x.created_at})),null,2));'
            echo
            echo "===== RECENT ERROR LOGS ====="
          } | tee hostless-diagnostics/summary.txt

          hostless logs --app "$APP" --since "$WINDOW" --level error 2>&1 | tee hostless-diagnostics/recent-errors.log
          RECENT_STATUS=${PIPESTATUS[0]}
          echo "Recent log command exit code: $RECENT_STATUS" | tee -a hostless-diagnostics/summary.txt

          if [ -n "$DEPLOYMENT_ID" ]; then
            echo "===== DEPLOYMENT LOGS: $DEPLOYMENT_ID =====" | tee -a hostless-diagnostics/summary.txt
            hostless logs --app "$APP" --deployment "$DEPLOYMENT_ID" 2>&1 | tee hostless-diagnostics/deployment.log
            echo "Deployment log command exit code: ${PIPESTATUS[0]}" | tee -a hostless-diagnostics/summary.txt
            API="https://api.hostless.cloud/v1/apps/$APP/deployments/$DEPLOYMENT_ID"
            curl -sS -H "Authorization: $HOSTLESS_TOKEN" -H "Accept: application/json" "$API" -o hostless-diagnostics/deployment-detail.json
            curl -sS -H "Authorization: $HOSTLESS_TOKEN" -H "Accept: application/json" "$API/logs" -o hostless-diagnostics/deployment-api-logs.json
            curl -sS -H "Authorization: $HOSTLESS_TOKEN" -H "Accept: application/json" "$API/post-build-logs" -o hostless-diagnostics/post-build-logs.json
            echo "Fetched Hostless deployment detail, release logs, and post-build logs through the API." | tee -a hostless-diagnostics/summary.txt
          fi
          exit 0

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostless-${{ matrix.node }}-diagnostics-${{ github.run_id }}
          path: hostless-diagnostics/
          if-no-files-found: warn
          retention-days: 7
