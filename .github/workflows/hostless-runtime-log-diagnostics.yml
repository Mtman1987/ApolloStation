name: Hostless runtime log diagnostics
# Check current Node 2 release after disabling automatic Git deployments.
# Also capture the Node 2-only launcher port/bind retry and app-level start command; check whether the new command passes readiness.

on:
  schedule:
    - cron: '17 */6 * * *' # Every six hours, offset from common cron boundaries
  push:
    branches: [main]
    paths:
      - ".github/workflows/hostless-runtime-log-diagnostics.yml"
      - ".github/workflows/hostless-three-node-deploy.yml"
      - ".github/workflows/hostless-node2-retry.yml"
      - ".github/workflows/hostless-node2-fast-deploy.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Which Apollo Hostless node to inspect
        required: true
        type: choice
        options:
          - both
          - node1
          - node2
        default: both
      since:
        description: Recent log window (for example 30m or 2h)
        required: true
        type: string
        default: 2h
      deployment_id:
        description: Optional exact Hostless deployment ID (leave blank for recent runtime errors)
        required: false
        type: string
  workflow_run:
    workflows: ["ApolloStation Hostless two-node release", "ApolloStation Hostless Node 2 retry", "ApolloStation Hostless Node 2 fast deploy"]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  collect:
    name: Collect ${{ matrix.label }} logs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: node1
            label: Node 1
            app: apollo-node-1
            hostless_secret: HOSTLESS_NODE1_TOKEN
          - node: node2
            label: Node 2
            app: apollo-node-2
            hostless_secret: HOSTLESS_NODE2_TOKEN
    steps:
      - name: Check out diagnostic sanitizer
        uses: actions/checkout@v4

      - name: Resolve exact Node 2 deployment from the triggering run
        id: deployment
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          JOBS="$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100")"
          JOB_ID="$(printf '%s' "$JOBS" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s).jobs||[];const x=j.find(v=>v.name.startsWith("Deploy Node 2"));if(x)process.stdout.write(String(x.id));})')"
          if [ -z "$JOB_ID" ]; then echo "No Node 2 deployment job exists in source run."; exit 0; fi
          LOG="$(gh run view "$SOURCE_RUN_ID" --job "$JOB_ID" --repo "$REPOSITORY" --log 2>/dev/null || true)"
          DEPLOYMENT_ID="$(printf '%s\\n' "$LOG" | grep -Eo 'Deployment [a-f0-9]{24}:' | tail -n1 | awk '{print $2}' | tr -d ':' || true)"
          if [ -n "$DEPLOYMENT_ID" ]; then echo "id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"; echo "Resolved exact Node 2 deployment: $DEPLOYMENT_ID"; else echo "Could not extract a deployment ID from the Node 2 job log."; fi

      - name: Install Hostless CLI
        run: |
          curl -fsSL https://hostless.cloud/install.sh | bash
          hostless --version

      - name: Collect runtime and deployment logs
        env:
          HOSTLESS_TOKEN: ${{ secrets[matrix.hostless_secret] }}
          APP: ${{ matrix.app }}
          NODE: ${{ matrix.node }}
          TARGET: ${{ inputs.target }}
          EVENT_NAME: ${{ github.event_name }}
          SINCE: ${{ inputs.since || '2h' }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id || steps.deployment.outputs.id || '' }}
        run: |
          set +e
          mkdir -p hostless-diagnostics
          WINDOW="${SINCE:-2h}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$TARGET" ] && [ "$TARGET" != "both" ] && [ "$TARGET" != "$NODE" ]; then
            echo "Skipping $NODE because target is $TARGET."
            exit 0
          fi
          API="https://api.hostless.cloud/v1/apps/$APP"
          curl -sS -H "Authorization: $HOSTLESS_TOKEN" -H "Accept: application/json" "$API" -o hostless-diagnostics/app-detail.json
          curl -sS -H "Authorization: $HOSTLESS_TOKEN" -H "Accept: application/json" "$API/deployments" -o hostless-diagnostics/deployments.json
          curl -sS -H "Authorization: $HOSTLESS_TOKEN" -H "Accept: application/json" "$API/metrics/cpu-usage" -o hostless-diagnostics/cpu-usage.json
          curl -sS -H "Authorization: $HOSTLESS_TOKEN" -H "Accept: application/json" "$API/metrics/memory-usage" -o hostless-diagnostics/memory-usage.json
          APP_URL="$(node --input-type=module -e 'import fs from "node:fs"; const d=JSON.parse(fs.readFileSync("hostless-diagnostics/app-detail.json","utf8")); const a=d.app??d; process.stdout.write(String(a.url??a.appUrl??a.publicUrl??""));')"
          if [ -n "$APP_URL" ]; then
            if curl -fsS --max-time 20 "$APP_URL/health/ready" -o hostless-diagnostics/health-ready.json; then
              echo "HTTP readiness passed for $APP: $APP_URL/health/ready"
            else
              echo "HTTP readiness did not pass for $APP: $APP_URL/health/ready (curl exit $?)"
            fi
          else
            echo "No public app URL was returned for $APP; HTTP readiness was not tested."
          fi

          # Capture a bounded HTTP behavior matrix. Record status/timing separately
          # from bodies so 4xx/5xx responses remain useful evidence rather than vanishing.
          : > hostless-diagnostics/http-probes.txt
          if [ -n "$APP_URL" ]; then
            for route in / /health/live /health/ready /login /api/health; do
              safe_name="$(printf '%s' "$route" | tr '/-' '__')"
              code="$(curl -sS --max-time 20 -o "hostless-diagnostics/http-${safe_name}.body" -w '%{http_code}' "$APP_URL$route" 2>"hostless-diagnostics/http-${safe_name}.stderr" || true)"
              timing="$(curl -sS --max-time 20 -o /dev/null -w 'total=%{time_total}s connect=%{time_connect}s ttfb=%{time_starttransfer}s bytes=%{size_download}' "$APP_URL$route" 2>/dev/null || true)"
              printf '%-18s status=%s %s\\n' "$route" "${code:-000}" "$timing" | tee -a hostless-diagnostics/http-probes.txt
            done
          else
            echo "HTTP probes skipped: no public URL." | tee -a hostless-diagnostics/http-probes.txt
          fi
          # Capture informational and warning logs as well as errors. Keep the
          # complete output in the Actions artifact; the issue publisher bounds excerpts.
          hostless logs --app "$APP" --since "$WINDOW" --level warn > hostless-diagnostics/recent-warnings.log 2>&1
          WARN_STATUS=$?
          echo "Warning log command exit code: $WARN_STATUS" >> hostless-diagnostics/summary.txt

          hostless logs --app "$APP" --since "$WINDOW" --level info > hostless-diagnostics/recent-info.log 2>&1

          INFO_STATUS=$?

          echo "Info log command exit code: $INFO_STATUS" >> hostless-diagnostics/summary.txt

          # Record configuration key names only; never retrieve or print secret values.
          curl -sS --max-time 20 -H "Authorization: $HOSTLESS_TOKEN" -H "Accept: application/json" "$API/environment-variables" -o hostless-diagnostics/environment-variable-names.json
          node --input-type=module -e 'import fs from "node:fs"; const p="hostless-diagnostics/environment-variable-names.json"; try { const d=JSON.parse(fs.readFileSync(p,"utf8")); const a=Array.isArray(d)?d:(d.variables??d.environmentVariables??d.items??d.data??[]); fs.writeFileSync("hostless-diagnostics/environment-variable-names.json",JSON.stringify(a.map(x=>x.name??x.key).filter(x=>typeof x==="string").sort(),null,2)); } catch { fs.writeFileSync(p,"[unparseable response; raw body intentionally discarded]"); }'
          {
            echo "App: $APP"
            echo "Window: $WINDOW"
            echo "Timestamp (UTC): $(date -u +%FT%TZ)"
            echo "Git commit: ${GITHUB_SHA}"
            echo "Workflow run: ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            echo "Runner Node: $(node --version)"
            echo "Hostless CLI: $(hostless --version 2>&1 | head -n 1)"
            echo
            echo "===== HOSTLESS APP STATE ====="
            node --input-type=module -e 'import fs from "node:fs"; const d=JSON.parse(fs.readFileSync("hostless-diagnostics/app-detail.json","utf8")); const a=d.app??d; const pick=(o,keys)=>Object.fromEntries(keys.filter(k=>o?.[k]!==undefined).map(k=>[k,o[k]])); console.log(JSON.stringify({...pick(a,["id","name","status","state","appState","url","appUrl","publicUrl","defaultDomain","domains","containerPort"]),...pick(d,["status","state"])},null,2));'
            echo
            echo "===== RESOURCE METRICS ====="
            for metric in cpu-usage memory-usage; do echo "$metric:"; head -c 4000 "hostless-diagnostics/$metric.json"; echo; done
            echo
            echo "===== RECENT DEPLOYMENTS ====="
            node --input-type=module -e 'import fs from "node:fs"; const d=JSON.parse(fs.readFileSync("hostless-diagnostics/deployments.json","utf8")); const rows=Array.isArray(d)?d:(d.items??d.deployments??d.data??[]); console.log(JSON.stringify(rows.slice(0,8).map(x=>({id:x.id??x._id,status:x.status,trigger:x.trigger,commit:x.commitSha??x.commit??x.gitCommit,createdAt:x.createdAt??x.created_at})),null,2));'
            echo
            echo "===== RECENT ERROR LOGS ====="
          } | tee hostless-diagnostics/summary.txt

          hostless logs --app "$APP" --since "$WINDOW" --level error > hostless-diagnostics/recent-errors.log 2>&1
          RECENT_STATUS=$?
          echo "Recent log command exit code: $RECENT_STATUS" | tee -a hostless-diagnostics/summary.txt

          if [ -z "$DEPLOYMENT_ID" ]; then
            DEPLOYMENT_ID="$(node --input-type=module -e 'import fs from "node:fs"; const d=JSON.parse(fs.readFileSync("hostless-diagnostics/deployments.json","utf8")); const rows=Array.isArray(d)?d:(d.items??d.deployments??d.data??[]); const x=rows[0]; process.stdout.write(String(x?.id??x?._id??""));')"
            if [ -n "$DEPLOYMENT_ID" ]; then echo "Resolved latest Hostless deployment from the app deployment list: $DEPLOYMENT_ID"; fi
          fi
          if [ -n "$DEPLOYMENT_ID" ]; then
            echo "===== DEPLOYMENT LOGS: $DEPLOYMENT_ID =====" | tee -a hostless-diagnostics/summary.txt
            hostless logs --app "$APP" --deployment "$DEPLOYMENT_ID" > hostless-diagnostics/deployment.log 2>&1
            DEPLOYMENT_LOG_STATUS=$?
            echo "Deployment log command exit code: $DEPLOYMENT_LOG_STATUS" | tee -a hostless-diagnostics/summary.txt
            API="https://api.hostless.cloud/v1/apps/$APP/deployments/$DEPLOYMENT_ID"
            curl -sS -H "Authorization: $HOSTLESS_TOKEN" -H "Accept: application/json" "$API" -o hostless-diagnostics/deployment-detail.json
            curl -sS -H "Authorization: $HOSTLESS_TOKEN" -H "Accept: application/json" "$API/logs" -o hostless-diagnostics/deployment-api-logs.json
            curl -sS -H "Authorization: $HOSTLESS_TOKEN" -H "Accept: application/json" "$API/post-build-logs" -o hostless-diagnostics/post-build-logs.json
            echo "Fetched Hostless deployment detail, release logs, and post-build logs through the API." | tee -a hostless-diagnostics/summary.txt
          fi
          exit 0

      - name: Sanitize diagnostic files before any publication
        id: sanitize
        if: always()
        run: |
          set -euo pipefail
          if [ -d hostless-diagnostics ]; then
            node scripts/sanitize-diagnostics.mjs hostless-diagnostics
          else
            echo "No diagnostic directory was created."
          fi

      - name: Publish sanitized agent-readable summary
        if: ${{ always() && steps.sanitize.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NODE: ${{ matrix.node }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          node = os.environ["NODE"]
          run_id = os.environ["RUN_ID"]
          files = [pathlib.Path('hostless-diagnostics/summary.txt'), pathlib.Path('hostless-diagnostics/app-detail.json'), pathlib.Path('hostless-diagnostics/deployments.json'), pathlib.Path('hostless-diagnostics/cpu-usage.json'), pathlib.Path('hostless-diagnostics/memory-usage.json'), pathlib.Path('hostless-diagnostics/health-ready.json'), pathlib.Path('hostless-diagnostics/http-probes.txt'), pathlib.Path('hostless-diagnostics/recent-errors.log'), pathlib.Path('hostless-diagnostics/recent-warnings.log'), pathlib.Path('hostless-diagnostics/recent-info.log'), pathlib.Path('hostless-diagnostics/environment-variable-names.json'), pathlib.Path('hostless-diagnostics/deployment.log'), pathlib.Path('hostless-diagnostics/deployment-api-logs.json'), pathlib.Path('hostless-diagnostics/post-build-logs.json'), pathlib.Path('hostless-diagnostics/deployment-detail.json')]
          files.extend(sorted(pathlib.Path('hostless-diagnostics').glob('http-*.body')))
          def redact(s):
            patterns = [(r'(?i)(authorization\s*[:=]\s*bearer\s+)\S+', r'\1[REDACTED]'), (r'(?i)(bearer\s+)\S+', r'\1[REDACTED]'), (r'(?i)(cookie|set-cookie)\s*[:=]\s*[^\r\n]+', r'\1: [REDACTED]'), (r'(?i)(["\']?(?:token|secret|password|passwd|api[_-]?key|session[_-]?key)["\']?\s*[:=]\s*["\']?)[^\s,;"\']+', r'\1[REDACTED]'), (r'(?i)(sk-[a-z0-9_-]{12,}|gh[pousr]_[a-z0-9]{20,}|github_pat_[a-z0-9_]{20,})', '[REDACTED]'), (r'(?i)(eyJ[a-z0-9_-]{10,}\.)[a-z0-9_-]{10,}(?:\.[a-z0-9_-]{10,})?', '[REDACTED-JWT]')]
            for p, repl in patterns: s = re.sub(p, repl, s)
            return s
          out = ['## '+node+' diagnostics — run '+run_id, '']
          budget = 48000
          for f in files:
            if not f.exists() or budget <= 0: continue
            content = redact(f.read_text(errors='replace'))
            excerpt = content[:min(6000, budget)]
            out += ['### '+f.name, '```text', excerpt, '```', '']
            budget -= len(excerpt)
          out += ['[Issue comment excerpts are bounded; the complete sanitized collection is in the workflow artifact.]']
          pathlib.Path('agent-summary.md').write_text('\n'.join(out))
          PY
          gh issue comment 517 --repo "$REPOSITORY" --body-file agent-summary.md

      - name: Upload diagnostic logs
        if: ${{ always() && steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: hostless-${{ matrix.node }}-diagnostics-${{ github.run_id }}
          path: hostless-diagnostics/
          if-no-files-found: warn
          retention-days: 7
