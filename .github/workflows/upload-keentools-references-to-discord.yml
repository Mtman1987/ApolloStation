name: Upload KeenTools References to Discord
run-name: Upload Neon Lock In Gamer reference views to Discord

on:
  push:
    branches: [fix/keentools-discord-cdn-reconstruction]
    paths:
      - ".github/workflows/upload-keentools-references-to-discord.yml"
      - ".github/scripts/post-keentools-references-to-discord.mjs"
  workflow_dispatch:
    inputs:
      reference_archive_url:
        description: "Direct HTTPS download URL for the prepared 10-view ZIP"
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload-references:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out ApolloStation
        uses: actions/checkout@v5

      - name: Upload the ten PNG views to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_HEAD_UPLOAD_WEBHOOK }}
          REFERENCE_ARCHIVE_URL: ${{ inputs.reference_archive_url || 'https://raw.githubusercontent.com/Mtman1987/ApolloStation/fix/keentools-discord-cdn-reconstruction/neon_lock_in_gamer_keentools_reference_views.zip' }}
        run: node .github/scripts/post-keentools-references-to-discord.mjs

      - name: Persist Discord message IDs and CDN URLs for the next workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const manifest = await readFile("discord-reference-upload-result.json", "utf8");
          const api = process.env.GITHUB_API_URL || "https://api.github.com";
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
          const path = ".github/data/keentools-discord-reference-upload.json";
          const headers = {
            authorization: `Bearer ${process.env.GH_TOKEN}`,
            accept: "application/vnd.github+json",
            "x-github-api-version": "2022-11-28",
            "content-type": "application/json"
          };
          const url = `${api}/repos/${owner}/${repo}/contents/${path}`;
          const existing = await fetch(url, { headers });
          let sha;
          if (existing.ok) sha = (await existing.json()).sha;
          else if (existing.status !== 404) throw new Error(`Cannot check manifest path: HTTP ${existing.status}`);
          const body = {
            message: "Persist Discord KeenTools reference image message IDs and CDN URLs",
            content: Buffer.from(manifest).toString("base64"),
            ...(sha ? { sha } : {})
          };
          const saved = await fetch(url, { method: "PUT", headers, body: JSON.stringify(body) });
          if (!saved.ok) throw new Error(`Manifest commit failed: HTTP ${saved.status} ${(await saved.text()).slice(0, 300)}`);
          const result = await saved.json();
          console.log(`Persisted manifest at ${path} (commit ${result.commit.sha})`);
          NODE

      - name: Save returned Discord message IDs and CDN URLs
        uses: actions/upload-artifact@v4
        with:
          name: keentools-discord-reference-message-ids
          path: discord-reference-upload-result.json
          if-no-files-found: error
          retention-days: 90
