name: Manual KeenTools Avatar Reconstruction
run-name: KeenTools manual reconstruction — exact Discord message 1563674871119216749

on:
  push:
    branches: [fix/keentools-discord-cdn-reconstruction]
    paths:
      - ".github/workflows/keentools-manual-reconstruct.yml"
      - ".github/data/keentools-discord-reference-upload.json"
      - ".github/scripts/keentools-manual-reconstruct.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keentools-manual-reconstruction-exact-message
  cancel-in-progress: false

jobs:
  reconstruct:
    name: Fetch exact Discord message and reconstruct head with KeenTools
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Fetch the exact Discord message attachments and reconstruct head
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_REFERENCE_MESSAGE_ID: "1563674871119216749"
          STREAMWEAVER_KEENTOOLS_API_KEY_SECOND: ${{ secrets.STREAMWEAVER_KEENTOOLS_API_KEY_SECOND }}
        run: node .github/scripts/keentools-manual-reconstruct.mjs

      - name: Upload generated GLB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neon-lock-in-gamer-head-from-exact-discord-message
          path: keentools-output/
          if-no-files-found: error
          retention-days: 14
