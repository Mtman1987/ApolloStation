name: Manual KeenTools Avatar Reconstruction
run-name: KeenTools manual reconstruction — Neon Lock In Gamer

on:
  workflow_dispatch:
    inputs:
      reference_archive_url:
        description: "Direct HTTPS download URL for the prepared 10-view ZIP (must be accessible to GitHub Actions)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: keentools-manual-reconstruction
  cancel-in-progress: false

jobs:
  reconstruct:
    name: Reconstruct head and save GLB artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify local prerequisites
        run: |
          node --version
          unzip -v | head -n 1

      - name: Call KeenTools directly
        env:
          STREAMWEAVER_KEENTOOLS_API_KEY: ${{ secrets.STREAMWEAVER_KEENTOOLS_API_KEY }}
          REFERENCE_ARCHIVE_URL: ${{ inputs.reference_archive_url }}
        run: node .github/scripts/keentools-manual-reconstruct.mjs

      - name: Upload generated GLB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neon-lock-in-gamer-keentools-glb
          path: keentools-output/
          if-no-files-found: error
          retention-days: 14
