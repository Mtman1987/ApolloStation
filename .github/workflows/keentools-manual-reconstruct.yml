name: Manual KeenTools Avatar Reconstruction
run-name: KeenTools manual reconstruction — Neon Lock In Gamer

on:
  push:
    branches: [fix/keentools-discord-cdn-reconstruction]
    paths:
      - ".github/workflows/keentools-manual-reconstruct.yml"
      - ".github/data/keentools-discord-reference-upload.json"
      - ".github/scripts/keentools-manual-reconstruct.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keentools-manual-reconstruction
  cancel-in-progress: false

jobs:
  reconstruct:
    name: Reconstruct head from Discord CDN references and save GLB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository including the Discord CDN manifest
        uses: actions/checkout@v5

      - name: Verify local prerequisites and CDN manifest
        run: |
          node --version
          test -s .github/data/keentools-discord-reference-upload.json
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const manifest = JSON.parse(await readFile(".github/data/keentools-discord-reference-upload.json", "utf8"));
          const files = (manifest.messages ?? []).flatMap(m => m.attachments ?? []);
          if (files.length !== 10) throw new Error(`Expected 10 Discord CDN attachments; found ${files.length}`);
          for (const file of files) {
            const url = new URL(file.url);
            if (url.protocol !== "https:" || !["cdn.discordapp.com", "media.discordapp.net"].includes(url.hostname)) throw new Error(`Unexpected CDN URL for ${file.filename}`);
          }
          console.log("Discord CDN manifest valid: 10 images. No Discord bot token required.");
          NODE

      - name: Reconstruct head and facial expressions with KeenTools
        env:
          STREAMWEAVER_KEENTOOLS_API_KEY: ${{ secrets.STREAMWEAVER_KEENTOOLS_API_KEY_SECOND || secrets.STREAMWEAVER_KEENTOOLS_API_KEY }}
        run: node .github/scripts/keentools-manual-reconstruct.mjs

      - name: Upload generated GLB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neon-lock-in-gamer-keentools-glb
          path: keentools-output/
          if-no-files-found: error
          retention-days: 14
