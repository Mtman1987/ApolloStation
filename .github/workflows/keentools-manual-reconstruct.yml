name: Manual KeenTools Avatar Reconstruction
run-name: KeenTools manual reconstruction — Neon Lock In Gamer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/keentools-manual-reconstruct.yml"
      - ".github/scripts/keentools-manual-reconstruct.mjs"
  workflow_dispatch:
    inputs:
      discord_message_url:
        description: "Discord message link containing the approved 10-view ZIP"
        required: true
        default: "https://discord.com/channels/1240832965865635881/1476540488147533895/1563458971489271818"
        type: string

permissions:
  contents: read

concurrency:
  group: keentools-manual-reconstruction
  cancel-in-progress: false

jobs:
  reconstruct:
    name: Reconstruct head and save GLB artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify local prerequisites
        run: |
          node --version
          unzip -v | head -n 1

      - name: Call KeenTools directly
        env:
          STREAMWEAVER_KEENTOOLS_API_KEY: ${{ secrets.STREAMWEAVER_KEENTOOLS_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_MESSAGE_URL: ${{ inputs.discord_message_url || 'https://discord.com/channels/1240832965865635881/1476540488147533895/1563458971489271818' }}
        run: node .github/scripts/keentools-manual-reconstruct.mjs

      - name: Upload generated GLB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neon-lock-in-gamer-keentools-glb
          path: keentools-output/
          if-no-files-found: error
          retention-days: 14
