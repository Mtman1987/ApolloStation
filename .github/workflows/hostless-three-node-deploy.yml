name: ApolloStation Hostless two-node release
# Recovery gate: deployment verifies the shared Turso staging table contains all 5,748 verified records.
# Release re-run after Oracle validation passed on a8cccc85; retain the two-node production gate.

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "services/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/hostless-three-node-deploy.yml"
  push:
    branches: [main]
    paths:
      - "apps/spmt-service/**"
      - "apps/spacemountain-web/**"
      - "apps/spacemountain/**"
      - "apps/discord-stream-hub/**"
      - "apps/chat-gateway/**"
      - "apps/streamweaver/**"
      - "apps/nebula-arcade/**"
      - "packages/**"
      - "services/**"
      - "hostless.yaml"
      - "package.json"
      - "package-lock.json"
      - "tests/**"
      - "tsconfig*.json"
      - "scripts/hostless/**"
      - "scripts/nebula-tenant-discovery.mjs"
      - "scripts/import-staged-nebula-tag-to-turso.mjs"
      - "tests/nebula-tenant-discovery.test.mjs"
      - ".github/workflows/hostless-three-node-deploy.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy Node 1 and Node 2 after full validation"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apollo-hostless-release
  cancel-in-progress: true

jobs:
  detect-deploy-targets:
    name: Detect which Hostless nodes changed
    runs-on: ubuntu-latest
    outputs:
      node1: ${{ steps.targets.outputs.node1 }}
      node2: ${{ steps.targets.outputs.node2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identify node-specific changes
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DEPLOY_MANUAL: ${{ inputs.deploy }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "${COMMIT_MESSAGE:-}" == *"[cancel-stale-hostless-release]"* ]]; then
            echo "node1=false" >> "$GITHUB_OUTPUT"
            echo "node2=false" >> "$GITHUB_OUTPUT"
            echo "Cancel-only run: no Hostless node will be deployed."
            exit 0
          fi
          if [[ "${COMMIT_MESSAGE:-}" == *"[node2-only]"* ]]; then
            echo "node1=false" >> "$GITHUB_OUTPUT"
            echo "node2=true" >> "$GITHUB_OUTPUT"
            echo "Node 2-only recovery deployment requested."
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "node1=true" >> "$GITHUB_OUTPUT"
            echo "node2=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "node1=true" >> "$GITHUB_OUTPUT"
            echo "node2=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
          printf '%s\\n' "$CHANGED"
          NODE1=false
          NODE2=false
          while IFS= read -r file; do
            case "$file" in
              apps/spmt-service/*|apps/spacemountain-web/*|apps/spacemountain/*|apps/discord-stream-hub/*|packages/*|services/*|hostless.yaml|package.json|package-lock.json|tsconfig*.json|scripts/hostless/start-node.mjs|.github/workflows/hostless-three-node-deploy.yml)
                NODE1=true
                ;;
            esac
            case "$file" in
              apps/chat-gateway/*|apps/streamweaver/*|apps/nebula-arcade/*|packages/*|services/*|hostless.yaml|package.json|package-lock.json|tsconfig*.json|scripts/hostless/start-node.mjs|.github/workflows/hostless-three-node-deploy.yml)
                NODE2=true
                ;;
            esac
          done <<< "$CHANGED"
          echo "node1=$NODE1" >> "$GITHUB_OUTPUT"
          echo "node2=$NODE2" >> "$GITHUB_OUTPUT"

  full-test-suite:
    if: ${{ !contains(github.event.head_commit.message, '[cancel-stale-hostless-release]') && !contains(github.event.head_commit.message, '[skip-hostless-validation]') }}
    name: Full ApolloStation validation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate Hostless launch and deploy helpers
        run: |
          node --check scripts/hostless/ensure-node-app.mjs
          node --check scripts/hostless/start-node.mjs
      - name: Install media test tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
          ffmpeg -version
      - name: Audit SQLite ownership and persistence surface
        run: |
          node scripts/audit-sqlite-usage.mjs --json > /tmp/apollo-sqlite-audit.json
          node -e "const r=require('/tmp/apollo-sqlite-audit.json'); console.log(JSON.stringify(r.totals, null, 2))"
      - name: Build and run every Node regression test
        run: npm test

  deploy-node:
    name: Deploy ${{ matrix.label }}
    needs: [full-test-suite]
    if: >-
      ${{ !cancelled() && (needs.full-test-suite.result == 'success' || (needs.full-test-suite.result == 'skipped' && contains(github.event.head_commit.message, '[skip-hostless-validation]'))) &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.deploy == true)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - node: node1
            label: "Node 1 — SPMT authority / SpaceMountain / OverlayBay"
            app: apollo-node-1
            hostless_secret: HOSTLESS_NODE1_TOKEN
          - node: node2
            label: "Node 2 — Chat Gateway / StreamWeaver / Nebula"
            app: apollo-node-2
            hostless_secret: HOSTLESS_NODE2_TOKEN
    steps:
      - name: Check out the exact validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify this node has a production launcher
        env:
          NODE_ROLE: ${{ matrix.node }}
        run: |
          node - <<'NODE'
          const role = process.env.NODE_ROLE;
          const scripts = require("./package.json").scripts || {};
          const launcher = scripts["hostless:" + role];
          if (typeof launcher !== "string" || !launcher.trim()) {
            console.error("Missing production launcher for " + role + "; refusing to create or modify a Hostless app.");
            process.exit(1);
          }
          NODE
      - name: Validate required runtime configuration before touching Hostless
        env:
          NODE_ROLE: ${{ matrix.node }}
          SPMT_WEBHOOK_KEY: ${{ secrets.SPMT_WEBHOOK_KEY }}
          CHAT_GATEWAY_WORKER_CREDENTIAL: ${{ secrets.CHAT_GATEWAY_WORKER_CREDENTIAL }}
          STREAMWEAVER_WORKER_CREDENTIAL: ${{ secrets.STREAMWEAVER_WORKER_CREDENTIAL }}
          NEBULA_ARCADE_WORKER_CREDENTIAL: ${{ secrets.NEBULA_ARCADE_WORKER_CREDENTIAL }}
          NEBULA_ARCADE_TENANT_ID: ${{ secrets.NEBULA_ARCADE_TENANT_ID }}
          NEBULA_ARCADE_CHANNEL_ID: ${{ secrets.NEBULA_ARCADE_CHANNEL_ID }}
          NEBULA_ARCADE_PUBLIC_ORIGIN: ${{ secrets.NEBULA_ARCADE_PUBLIC_ORIGIN }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          SPMT_PROVIDER_CREDENTIAL_KEY: ${{ secrets.SPMT_PROVIDER_CREDENTIAL_KEY }}
          MOSAIC_STREAMWEAVER_SERVICE_TOKEN: ${{ secrets.MOSAIC_STREAMWEAVER_SERVICE_TOKEN }}
          DSH_RUNTIME_CONFIG_JSON: ${{ secrets.DSH_RUNTIME_CONFIG_JSON }}
          NEBULA_ARCADE_RUNTIME_CONFIG_JSON: ${{ secrets.NEBULA_ARCADE_RUNTIME_CONFIG_JSON }}
          TWITCH_BOT_TOKEN: ${{ secrets.TWITCH_BOT_TOKEN }}
        run: |
          node --input-type=module - <<'NODE'
          const role = process.env.NODE_ROLE;
          const required = role === "node1"
            ? ["SPMT_WEBHOOK_KEY", "CHAT_GATEWAY_WORKER_CREDENTIAL", "STREAMWEAVER_WORKER_CREDENTIAL", "NEBULA_ARCADE_WORKER_CREDENTIAL"]
            : ["CHAT_GATEWAY_WORKER_CREDENTIAL", "STREAMWEAVER_WORKER_CREDENTIAL"];
          // Existing Hostless app environment is authoritative for optional integrations.
          // Only require the shared node-to-node credentials here. Optional OAuth, DSH,
          // Mosaic, and Nebula settings are synchronized when supplied by Actions; empty
          // Actions values are skipped by ensure-node-app.mjs and do not erase Hostless values.
          const missing = required.filter((name) => !process.env[name]?.trim());
          if (missing.length) {
            console.error("Missing ApolloStation Actions secrets required by " + role + ": " + missing.join(", "));
            process.exit(1);
          }
          for (const name of required.filter((name) => name.endsWith("_WORKER_CREDENTIAL"))) {
            if ((process.env[name] ?? "").length < 32) {
              console.error(name + " must be at least 32 characters.");
              process.exit(1);
            }
          }
          // TWITCH_BOT_TOKEN is already provisioned in the Hostless app environment.
          // Do not require a duplicate GitHub Actions secret or overwrite the Hostless value.
          const runtimeConfigName = role === "node1" ? "DSH_RUNTIME_CONFIG_JSON" : "NEBULA_ARCADE_RUNTIME_CONFIG_JSON";
          if (process.env[runtimeConfigName]?.trim()) {
            let config;
            try { config = JSON.parse(process.env[runtimeConfigName]); } catch { console.error(runtimeConfigName + " must be valid JSON when supplied."); process.exit(1); }
            if (config?.schemaVersion !== 1 || !Array.isArray(config.tenants)) {
              console.error(runtimeConfigName + " must be a version 1 config with a tenants array when supplied.");
              process.exit(1);
            }
          }
          if (process.env.SPMT_WEBHOOK_KEY?.trim() && role === "node1" && Buffer.from(process.env.SPMT_WEBHOOK_KEY, "base64url").byteLength !== 32) {
            console.error("SPMT_WEBHOOK_KEY must be base64url for exactly 32 bytes when supplied.");
            process.exit(1);
          }
          if (process.env.SPMT_PROVIDER_CREDENTIAL_KEY?.trim() && Buffer.from(process.env.SPMT_PROVIDER_CREDENTIAL_KEY, "base64url").byteLength !== 32) {
            console.error("SPMT_PROVIDER_CREDENTIAL_KEY must be base64url for exactly 32 bytes when supplied.");
            process.exit(1);
          }
          console.log("Required runtime configuration is present; values were not printed.");
          NODE
      - name: Verify both nodes target the same Turso database and inspect recovery staging
        env:
          SHARED_TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL || vars.TURSO_DATABASE_URL || 'libsql://apollo-persistence-spike-mtman1987.aws-us-east-1.turso.io' }}
          NODE1_TURSO_AUTH_TOKEN: ${{ secrets.NODE1_TURSO_AUTH_TOKEN }}
          NODE2_TURSO_AUTH_TOKEN: ${{ secrets.NODE2_TURSO_AUTH_TOKEN }}
        run: |
          node --input-type=module - <<'NODE'
          import { TursoHttpAdapter, normalizeTursoUrl } from "./packages/turso-http/index.mjs";
          const pairs = [
            ["node1", process.env.SHARED_TURSO_DATABASE_URL, process.env.NODE1_TURSO_AUTH_TOKEN],
            ["node2", process.env.SHARED_TURSO_DATABASE_URL, process.env.NODE2_TURSO_AUTH_TOKEN],
          ];
          for (const [name, url, token] of pairs) {
            if (!url?.trim() || !token?.trim()) {
              throw new Error("The shared Turso URL and both node auth tokens are required for shared-database verification.");
            }
          }
          if (normalizeTursoUrl(pairs[0][1]) !== normalizeTursoUrl(pairs[1][1])) {
            throw new Error("Node 1 and Node 2 are configured for different Turso database endpoints; refusing deployment.");
          }
          const results = [];
          for (const [name, url, authToken] of pairs) {
            const db = new TursoHttpAdapter({ url, authToken });
            await db.execute("SELECT 1", [], true);
            const table = await db.execute(
              "SELECT name FROM sqlite_master WHERE type='table' AND name=?",
              ["apollo_recovered_json_stage_v1"], true,
            );
            if (!table.rows.length) {
              throw new Error("Recovered-data staging table is missing; refusing to deploy an empty recovery state.");
            }
            const count = await db.execute("SELECT COUNT(*) FROM apollo_recovered_json_stage_v1", [], true);
            const stagedDocuments = Number(count.rows[0]?.[0] ?? 0);
            const bySourceResult = await db.execute(
              "SELECT source, COUNT(*) FROM apollo_recovered_json_stage_v1 GROUP BY source",
              [], true,
            );
            const bySource = Object.fromEntries(bySourceResult.rows.map((row) => [String(row[0]), Number(row[1])]));
            const expectedBySource = { "nebula-legacy-global": 16, streamweaver: 5732 };
            if (stagedDocuments !== 5748 ||
                bySource["nebula-legacy-global"] !== expectedBySource["nebula-legacy-global"] ||
                bySource.streamweaver !== expectedBySource.streamweaver ||
                Object.keys(bySource).length !== 2) {
              throw new Error("Recovered-data staging is incomplete or has unexpected source counts; expected 16 legacy-global + 5,732 StreamWeaver documents (5,748 total).");
            }
            results.push({ node: name, reachable: true, recoveredJsonStageTable: true, stagedDocuments, bySource });
          }
          if (results[0].stagedDocuments !== results[1].stagedDocuments ||
              JSON.stringify(results[0].bySource) !== JSON.stringify(results[1].bySource)) {
            throw new Error("Node 1 and Node 2 did not read the same recovered-data staging state.");
          }
          console.log(JSON.stringify({ sharedDatabaseEndpoint: true, nodes: results }));
          NODE
      - name: Build the verified Nebula recovery importer
        if: ${{ matrix.node == 'node2' }}
        run: |
          npm ci
          npm run build
          node --check scripts/import-staged-nebula-tag-to-turso.mjs
      - name: Import recovered legacy global Tag players into Nebula Turso
        if: ${{ matrix.node == 'node2' }}
        env:
          NEBULA_ARCADE_TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL || vars.TURSO_DATABASE_URL || 'libsql://apollo-persistence-spike-mtman1987.aws-us-east-1.turso.io' }}
          NEBULA_ARCADE_TURSO_AUTH_TOKEN: ${{ secrets.NODE2_TURSO_AUTH_TOKEN }}
          SPMT_ORIGIN: "https://apollo-node-1.hostless.app"
          CHAT_GATEWAY_WORKER_CREDENTIAL: ${{ secrets.CHAT_GATEWAY_WORKER_CREDENTIAL }}
        run: node scripts/import-staged-nebula-tag-to-turso.mjs
      - name: Install Hostless CLI
        run: |
          curl -fsSL https://hostless.cloud/install.sh | bash
          hostless --version
      - name: Deploy this node using its own Hostless token
        env:
          HOSTLESS_TOKEN: ${{ secrets[matrix.hostless_secret] }}
          HOSTLESS_NODE1_TOKEN: ${{ secrets.HOSTLESS_NODE1_TOKEN }}
          APOLLO_RUNTIME_NODE1_SPMT_WEBHOOK_KEY: ${{ secrets.SPMT_WEBHOOK_KEY }}
          APOLLO_RUNTIME_NODE1_SPMT_PROVIDER_CREDENTIAL_KEY: ${{ secrets.SPMT_PROVIDER_CREDENTIAL_KEY }}
          APOLLO_RUNTIME_NODE1_TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          APOLLO_RUNTIME_NODE1_TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          APOLLO_RUNTIME_NODE1_DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          APOLLO_RUNTIME_NODE1_DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          APOLLO_RUNTIME_NODE1_DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          APOLLO_RUNTIME_NODE1_SPMT_PUBLIC_URL: "https://apollo-node-1.hostless.app"
          APOLLO_RUNTIME_NODE1_SPMT_PUBLIC_ORIGIN: "https://apollo-node-1.hostless.app"
          APOLLO_RUNTIME_NODE1_SPMT_RUNTIME_MODE: "production"
          APOLLO_RUNTIME_NODE1_SPMT_APP_LAUNCH_BASE_URL: "https://apollo-node-1.hostless.app"
          APOLLO_RUNTIME_NODE1_STREAMWEAVER_WEB_ORIGIN: "https://apollo-node-2.hostless.app"
          APOLLO_RUNTIME_NODE1_CHAT_GATEWAY_WORKER_CREDENTIAL: ${{ secrets.CHAT_GATEWAY_WORKER_CREDENTIAL }}
          APOLLO_RUNTIME_NODE1_STREAMWEAVER_WORKER_CREDENTIAL: ${{ secrets.STREAMWEAVER_WORKER_CREDENTIAL }}
          APOLLO_RUNTIME_NODE1_NEBULA_ARCADE_WORKER_CREDENTIAL: ${{ secrets.NEBULA_ARCADE_WORKER_CREDENTIAL }}
          APOLLO_RUNTIME_NODE1_SPMT_CHAT_GATEWAY_ENABLED: "1"
          APOLLO_RUNTIME_NODE1_SPMT_STREAMWEAVER_PROVIDER_RUNTIME_ENABLED: "1"
          APOLLO_RUNTIME_NODE1_SPMT_NEBULA_ARCADE_PROVIDER_RUNTIME_ENABLED: "1"
          APOLLO_RUNTIME_NODE1_TURSO_AUTH_TOKEN: ${{ secrets.NODE1_TURSO_AUTH_TOKEN }}
          APOLLO_RUNTIME_NODE1_TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL || vars.TURSO_DATABASE_URL || 'libsql://apollo-persistence-spike-mtman1987.aws-us-east-1.turso.io' }}
          APOLLO_RUNTIME_NODE2_SPMT_ORIGIN: "https://apollo-node-1.hostless.app"
          APOLLO_RUNTIME_NODE2_CHAT_GATEWAY_DATABASE_PATH: "/tmp/apollo-chat-gateway.sqlite"
          APOLLO_RUNTIME_NODE2_CHAT_GATEWAY_WORKER_CREDENTIAL: ${{ secrets.CHAT_GATEWAY_WORKER_CREDENTIAL }}
          APOLLO_RUNTIME_NODE2_TWITCH_BOT_TOKEN: ${{ secrets.TWITCH_BOT_TOKEN }}
          APOLLO_RUNTIME_NODE2_TWITCH_BOT_USERNAME: "spacemountainlive"
          APOLLO_RUNTIME_NODE2_SPACEMOUNTAIN_TWITCH_CHANNEL: "mtman1987"
          APOLLO_RUNTIME_NODE2_SPMT_RUNTIME_MODE: "production"
          APOLLO_RUNTIME_NODE2_SPMT_OUTBOUND_MODE: "enabled"
          APOLLO_RUNTIME_NODE2_SPMT_LIVE_INGRESS_MODE: "disabled"
          APOLLO_RUNTIME_NODE2_STREAMWEAVER_PROVIDER_RUNTIME_ENABLED: "1"
          APOLLO_RUNTIME_NODE2_STREAMWEAVER_DATABASE_PATH: "/tmp/apollo-streamweaver.sqlite"
          APOLLO_RUNTIME_NODE2_STREAMWEAVER_URL: "https://apollo-node-2.hostless.app"
          APOLLO_RUNTIME_NODE2_DISCORD_STREAM_HUB_URL: "https://apollo-node-1.hostless.app"
          APOLLO_RUNTIME_NODE2_DSH_SERVICE_SECRET: ${{ secrets.DSH_SERVICE_SECRET }}
          APOLLO_RUNTIME_NODE2_MOSAIC_STREAMWEAVER_SERVICE_TOKEN: ${{ secrets.MOSAIC_STREAMWEAVER_SERVICE_TOKEN }}
          APOLLO_RUNTIME_NODE2_MOSAIC_IMAGE_PROVIDER: "pollinations"
          APOLLO_RUNTIME_NODE2_MOSAIC_IMAGE_FALLBACK_PROVIDERS: "pollinations"
          APOLLO_RUNTIME_NODE2_STREAMWEAVER_WORKER_CREDENTIAL: ${{ secrets.STREAMWEAVER_WORKER_CREDENTIAL }}
          APOLLO_RUNTIME_NODE2_NEBULA_ARCADE_TENANT_ID: ${{ secrets.NEBULA_ARCADE_TENANT_ID }}
          APOLLO_RUNTIME_NODE2_NEBULA_ARCADE_CHANNEL_ID: ${{ secrets.NEBULA_ARCADE_CHANNEL_ID }}
          APOLLO_RUNTIME_NODE2_NEBULA_ARCADE_RUNTIME_CONFIG_JSON: ${{ secrets.NEBULA_ARCADE_RUNTIME_CONFIG_JSON }}
          APOLLO_RUNTIME_NODE2_NEBULA_ARCADE_RUNTIME_CONFIG_PATH: "/tmp/apollo-nebula-runtime.json"
          APOLLO_RUNTIME_NODE2_NEBULA_ARCADE_PROVIDER_RUNTIME_ENABLED: "1"
          APOLLO_RUNTIME_NODE2_NEBULA_ARCADE_TAG_STORE: "turso"
          APOLLO_RUNTIME_NODE2_NEBULA_ARCADE_WORKER_CREDENTIAL: ${{ secrets.NEBULA_ARCADE_WORKER_CREDENTIAL }}
          APOLLO_RUNTIME_NODE2_NEBULA_ARCADE_PUBLIC_ORIGIN: "https://apollo-node-2.hostless.app"
          APOLLO_RUNTIME_NODE2_NEBULA_ARCADE_DATABASE_PATH: "/tmp/apollo-nebula-arcade.sqlite"
          APOLLO_RUNTIME_NODE2_TURSO_AUTH_TOKEN: ${{ secrets.NODE2_TURSO_AUTH_TOKEN }}
          APOLLO_RUNTIME_NODE2_TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL || vars.TURSO_DATABASE_URL || 'libsql://apollo-persistence-spike-mtman1987.aws-us-east-1.turso.io' }}
          APOLLO_RUNTIME_NODE2_NEBULA_ARCADE_TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL || vars.TURSO_DATABASE_URL || 'libsql://apollo-persistence-spike-mtman1987.aws-us-east-1.turso.io' }}
          APOLLO_RUNTIME_NODE2_NEBULA_ARCADE_TURSO_AUTH_TOKEN: ${{ secrets.NODE2_TURSO_AUTH_TOKEN }}
          APOLLO_RUNTIME_NODE2_NEBULA_ARCADE_GAME_RUNTIME_TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL || vars.TURSO_DATABASE_URL || 'libsql://apollo-persistence-spike-mtman1987.aws-us-east-1.turso.io' }}
          APOLLO_RUNTIME_NODE2_NEBULA_ARCADE_GAME_RUNTIME_TURSO_AUTH_TOKEN: ${{ secrets.NODE2_TURSO_AUTH_TOKEN }}
          APOLLO_RUNTIME_NODE2_STREAMWEAVER_TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL || vars.TURSO_DATABASE_URL || 'libsql://apollo-persistence-spike-mtman1987.aws-us-east-1.turso.io' }}
          APOLLO_RUNTIME_NODE2_STREAMWEAVER_TURSO_AUTH_TOKEN: ${{ secrets.NODE2_TURSO_AUTH_TOKEN }}
          APOLLO_RUNTIME_NODE1_DSH_WORKER_CREDENTIAL: ${{ secrets.DSH_WORKER_CREDENTIAL }}
          APOLLO_RUNTIME_NODE1_DSH_RUNTIME_CONFIG_JSON: ${{ secrets.DSH_RUNTIME_CONFIG_JSON }}
          APOLLO_RUNTIME_NODE1_DSH_RUNTIME_CONFIG_PATH: "/tmp/apollo-dsh-runtime.json"
          APOLLO_RUNTIME_NODE1_DSH_DATABASE_PATH: "/tmp/apollo-dsh.sqlite"
          APOLLO_RUNTIME_NODE1_DSH_DISCORD_PUBLIC_KEY: ${{ secrets.DSH_DISCORD_PUBLIC_KEY }}
          APOLLO_RUNTIME_NODE1_DSH_DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          APOLLO_RUNTIME_NODE1_SPMT_DSH_LIVE_RUNTIME_ENABLED: "1"
          APOLLO_RUNTIME_NODE1_DSH_SERVICE_SECRET: ${{ secrets.DSH_SERVICE_SECRET }}
          APOLLO_RUNTIME_NODE1_DSH_TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL || vars.TURSO_DATABASE_URL || 'libsql://apollo-persistence-spike-mtman1987.aws-us-east-1.turso.io' }}
          APOLLO_RUNTIME_NODE1_DSH_TURSO_AUTH_TOKEN: ${{ secrets.NODE1_TURSO_AUTH_TOKEN }}
          APOLLO_RUNTIME_NODE1_DSH_RAID_PILE_STORE: ${{ secrets.DSH_RAID_PILE_STORE }}
          APOLLO_RUNTIME_NODE1_DSH_MTFIXIT_STORE: ${{ secrets.DSH_MTFIXIT_STORE }}
          APOLLO_NODE_ROLE: ${{ matrix.node }}
        run: node scripts/hostless/ensure-node-app.mjs "${APOLLO_NODE_ROLE}" "${GITHUB_SHA}"

  attach-spacemountain-domain:
    name: Attach spacemountain.live to the Node 1 same-origin gateway
    needs: [full-test-suite, deploy-node]
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.deploy == true)) &&
          needs.full-test-suite.result == 'success' &&
          needs.deploy-node.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Attach domain and verify Hostless read-back
        env:
          HOSTLESS_TOKEN: ${{ secrets.HOSTLESS_NODE1_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const base = "https://api.hostless.cloud/v1";
          const app = "apollo-node-1";
          const domain = "spacemountain.live";
          const token = process.env.HOSTLESS_TOKEN;
          if (!token) throw new Error("HOSTLESS_NODE1_TOKEN is missing.");

          async function call(method, path, body) {
            const response = await fetch(base + path, {
              method,
              headers: {
                Authorization: token,
                Accept: "application/json",
                ...(body ? { "content-type": "application/json" } : {}),
              },
              ...(body ? { body: JSON.stringify(body) } : {}),
            });
            const raw = await response.text();
            let value = {};
            try { value = raw ? JSON.parse(raw) : {}; }
            catch { value = { message: raw.slice(0, 500) }; }
            if (!response.ok) {
              const detail = value?.message ?? value?.error ?? ("HTTP " + response.status);
              throw new Error("Hostless " + method + " " + path +
                " failed (" + response.status + "): " + String(detail).slice(0, 500));
            }
            return { status: response.status, value };
          }

          function domainItems(value) {
            if (Array.isArray(value)) return value;
            for (const key of ["domains", "customDomains", "items"]) {
              if (Array.isArray(value?.[key])) return value[key];
              if (Array.isArray(value?.data?.[key])) return value.data[key];
            }
            if (Array.isArray(value?.data)) return value.data;
            if (value?.domain || value?.hostname || value?.name) return [value];
            if (value?.data && typeof value.data === "object") {
              const nested = value.data;
              if (nested.domain || nested.hostname || nested.name) return [nested];
            }
            return [];
          }

          function hostname(item) {
            let value = String(item?.domain ?? item?.hostname ?? item?.name ?? "").toLowerCase();
            value = value.replace("https://", "").replace("http://", "");
            return value.endsWith("/") ? value.slice(0, -1) : value;
          }

          const path = "/apps/" + app + "/custom-domains";
          const before = await call("GET", path);
          let items = domainItems(before.value);
          let found = items.find(item => hostname(item) === domain);
          let attachResponse = null;

          if (!found) {
            attachResponse = await call("POST", path, { domain });
            // Hostless may need a moment to expose the newly attached record.
            // Retry read-back briefly; never treat a successful POST alone as proof.
            for (let attempt = 0; attempt < 5 && !found; attempt++) {
              if (attempt > 0) await new Promise(resolve => setTimeout(resolve, 2000));
              const readBack = await call("GET", path);
              items = domainItems(readBack.value);
              found = items.find(item => hostname(item) === domain);
            }
          }

          if (!found) {
            const safe = JSON.stringify({
              app, domain, attached: Boolean(attachResponse),
              attachStatus: attachResponse?.status ?? null,
              latestReadBack: before.value,
              latestItems: items,
            }, (key, value) => /token|secret|password|cookie|authorization/i.test(key)
              ? "[redacted]" : value, 2);
            console.error(safe);
            throw new Error("Hostless accepted or checked the request, but the domain was not present in the app's custom-domain read-back. DNS readiness is not confirmed.");
          }

          const status = found.status ?? found.verificationStatus ??
            found.dnsStatus ?? found.state ?? "not exposed by API response";
          const safe = JSON.stringify({
            app,
            domain,
            alreadyAttached: !attachResponse,
            attachStatus: attachResponse?.status ?? null,
            hostlessDomain: found,
            dnsOrCertificateStatus: status,
            dnsInstructions: found.dnsRecords ?? found.dnsRecordsRequired ??
              found.records ?? found.dns ?? null,
            nextStep: "If Hostless reports DNS pending, copy the exact record name and target shown for this app into the domain DNS provider. Keep the domain attached while Hostless verifies DNS and provisions TLS.",
          }, (key, value) => /token|secret|password|cookie|authorization/i.test(key)
            ? "[redacted]" : value, 2);
          console.log(safe);
          NODE
