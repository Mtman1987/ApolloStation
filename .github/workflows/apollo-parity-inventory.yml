name: Apollo parity inventory

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: read

concurrency:
  group: apollo-parity-inventory
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate parity inventory and publish report
        run: |
          node scripts/parity-audit.mjs | tee parity-report.md
          cat parity-report.md >> "$GITHUB_STEP_SUMMARY"
