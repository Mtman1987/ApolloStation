name: MountainView Commander validation

on:
  pull_request:
    paths:
      - apps/mountainview/src/commander-listener.ts
      - apps/mountainview/src/index.ts
      - apps/mountainview/src/platform-client.ts
      - apps/mountainview/src/voice-router.ts
      - apps/mountainview/src/web-server.ts
      - tests/mountainview-commander-listener.test.mjs
      - tests/mountainview-commander-browser.test.mjs
      - tests/mountainview-companion-platform.test.mjs
      - .github/workflows/mountainview-commander-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mountainview-commander-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commander:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Compile workspace
        run: npm run build
      - name: Run Commander MT and MountainView route regressions
        run: node --import ./scripts/offline-network-guard.mjs --test tests/mountainview-commander-listener.test.mjs tests/mountainview-commander-browser.test.mjs tests/mountainview-companion-platform.test.mjs
