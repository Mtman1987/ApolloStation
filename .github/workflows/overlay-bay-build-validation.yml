name: Overlay Bay build validation

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/spacemountain/src/overlay-bay-ui.ts"
      - "apps/spacemountain/**"
      - "packages/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/overlay-bay-build-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overlay-bay-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:offline
