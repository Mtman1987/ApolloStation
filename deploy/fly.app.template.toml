# Green application template. Copy into a concrete deployable; do not deploy this file directly.
app = "REPLACE_ME"
primary_region = "iad"

[env]
  PORT = "3000"
  SPMT_RUNTIME_MODE = "app"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health/ready"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
