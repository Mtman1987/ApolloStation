<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Apollo Bulletin</title><style>body{font:14px system-ui;width:320px;margin:14px;background:#101521;color:#eee}input,textarea,button{box-sizing:border-box;width:100%;margin:6px 0;padding:9px;border-radius:8px;border:1px solid #4a5364;background:#1b2432;color:#eee}textarea{height:100px}button{cursor:pointer;background:#344b6a}.item{padding:8px;margin:5px 0;border:1px solid #4a5364;border-radius:8px;font-size:12px;overflow-wrap:anywhere}#status{white-space:pre-wrap;font-size:12px;color:#b8c5d8}</style></head><body><h3>Apollo Bulletin</h3><input id="url" placeholder="Exact conversation URL"><textarea id="prompt" placeholder="Queue a task"></textarea><button id="add">Add to queue</button><button id="run">Run now (active tab only)</button><button id="pause">Pause</button><button id="resume">Resume</button><button id="stop">Stop</button><h4>Queue</h4><div id="queue"></div><div id="status">Loading…</div><script src="popup.js"></script></body></html>
