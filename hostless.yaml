build:
  system: auto
  command: "npm ci --prefer-offline --no-audit --no-fund && npm run build:hostless"
working_directory: /
build_context_directory: /
start_command: "node scripts/hostless/start-node2.mjs"
health_check:
  type: http
  http_path: /health/ready
  interval_in_seconds: 30
scaling:
  min_replicas: 1
  max_replicas: 1
  max_cpu: 0.5
  max_memory: 1024

# One lightweight dispatcher services the Turso-backed queue. Do not create one
# Hostless cron job per task; task schedules and continuation state live in Turso.
cron_jobs:
  - name: apollo-bulletin-resumer
    command: "node tools/apollo-bulletin/cron-tick.mjs"
    schedule: "*/1 * * * *"
    timezone_utc_offset: 0
    cpus: 0.01
    memory: 128
    status: active
