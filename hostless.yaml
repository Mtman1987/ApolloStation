build:
  system: auto
  command: "npm ci && npm run build"
working_directory: /
build_context_directory: /
start_command: "node scripts/hostless/start-node.mjs"
health_check:
  type: http
  http_path: /health/ready
  interval_in_seconds: 30
scaling:
  min_replicas: 1
  max_replicas: 1
  max_cpu: 0.5
  max_memory: 1024
