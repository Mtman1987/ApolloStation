build:
  system: docker
  dockerfile_path: tools/devops-cockpit/Dockerfile

start_command: node tools/devops-cockpit/server.mjs

scaling:
  trigger: http_requests
  min_cpu: 0.1
  max_cpu: 0.2
  min_memory: 256
  max_memory: 512
  min_replicas: 1
  max_replicas: 1

health_check:
  type: http
  http_path: /health/ready
  interval_in_seconds: 15

workers:
  - name: chatgpt-browser
    command: node tools/devops-cockpit/worker.mjs
    min_cpu_per_replica: 0.1
    max_cpu_per_replica: 0.2
    min_memory_per_replica: 256
    max_memory_per_replica: 512
    replicas: 1

cron_jobs:
  - name: chatgpt-test-prompt
    command: node tools/devops-cockpit/cron.mjs
    schedule: "*/15 * * * *"
    timezone_utc_offset: 0
    cpus: 0.1
    memory: 128
    status: paused
